<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ugoe studio output</title>
    <!-- 出力ウィンドウは背景を透過する (配信ソフトのウィンドウの取り込みにそのまま使う)。UI の要素を一切重ねない -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* @ugoe/ui を読まないので、文字の選択と画像のドラッグの既定 (tokens.css の末尾) をここにも書く */
      html {
        -webkit-user-select: none;
        user-select: none;
      }

      img,
      a {
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/output.ts"></script>
  </body>
</html>
