[package]
name = "ugoe-studio"
description = "ugoe スタジオ (Tauri バックエンド。配信用のアプリ、docs/adr/0028-studio.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "GPL-3.0-only"

[lib]
name = "ugoe_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# 操作 API の秘密 (トークンと鍵) の生成 (T0805。ugoe-mcp が使っているもので、新しい依存ではない)。
getrandom.workspace = true
# 仮想カメラの背景の画像 (WebP) のデコード (T0808。利用者の判断 2026-10-02)。
image-webp.workspace = true
serde.workspace = true
serde_json.workspace = true
# macOS で出力ウィンドウの背景を透過するには macos-private-api が要る (tauri.conf.json の macOSPrivateApi)
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-os.workspace = true
thiserror.workspace = true
# 操作 API の WebSocket のフレーム (T0805。HTTP の要求と握手の検査は自前。利用者の決定 2026-10-02)。
tungstenite.workspace = true
ugoe.workspace = true
ugoe-fs.workspace = true
ugoe-headless.workspace = true
ugoe-studio-vcam.workspace = true
# 仮想カメラの背景の画像 (JPEG) のデコード (T0808。利用者の判断 2026-10-02)。
zune-jpeg.workspace = true

[features]
# GPU で描くテスト (`just test-gpu`。仮想カメラの受け手の画)。
gpu-tests = []

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
