<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!-- ファビコンを取りに行かない (待ち受けはトークンの外の経路に答えない) -->
    <link rel="icon" href="data:," />
    <title>ugoe studio browser source</title>
    <!-- OBS のブラウザソース用のページ (docs/studio.md#ブラウザソース)。背景を透過し、UI の要素を一切重ねない -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* @ugoe/ui を読まないので、文字の選択と画像のドラッグの既定 (tokens.css の末尾) をここにも書く (output.html と同じ) */
      html {
        -webkit-user-select: none;
        user-select: none;
      }

      img,
      a {
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/source.ts"></script>
  </body>
</html>
