[package]
name = "ugoe-conformance"
description = "配布物の適合テスト: 参照の頂点の生成と、各バインディングの出力との比較 (tests/conformance/README.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
# 8 ビットの RGBA ではない PNG のテクスチャを書く (16 ビット・パレット。T0473)
png.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
ugoe.workspace = true
# テクスチャのデコードの結果を比べる (`ugoe_format::image`。T0466)
ugoe-format = { workspace = true, features = ["png"] }
ugoe-headless.workspace = true
ugoe-model = { workspace = true, features = ["std"] }

[lints]
workspace = true

[[bin]]
name = "ugoe-conformance"
path = "src/main.rs"
