name: Editor build

# エディタ・ビューア・スタジオのインストーラを各 OS のランナーでビルドし、成果物 (artifact) として置く。
# Tauri は他の OS 向けのクロスビルドが難しいので、OS ごとにネイティブでビルドする。
# 手元と同じ入口 `just app::build TARGET=<アプリ> PLATFORM=<OS>` (scripts/app-build.mjs) を使い、アプリごとの違い
# (エディタのサイドカー・スタジオの仮想カメラの DLL など) はそのスクリプトが持つ。できたものは target/dist/<アプリ>/<OS>/ に集まる。
# (Linux から Windows 向けの NSIS だけを作るクロスビルドもあるが、MSI を作れないので CI では使わない。)
# 署名と公証の Secrets は、`v*` のタグからだけ使える environment `release` に置く (docs/release.md#secrets-を置く-初回だけ人の手)。
# タグでは build-signed のジョブが environment を付けて署名し、それ以外 (手での起動・ブランチ) では build のジョブが environment を
# 付けずに署名せずに作る (ブランチから動かしても environment の保護の規則で失敗しない)。2 つのジョブの中身は YAML のアンカーで共有する。
# Secrets が無ければ署名せずに作るので、フォークや Secrets を置く前でも失敗しない。署名したかはジョブの要約に出る (scripts/app-build.mjs)。
# `v*` のタグでは、release.yml が重い検査 (release-checks.yml) を通してから呼び、できたインストーラをそのタグの GitHub Release の
# 下書きに添付する (release のジョブ。公開するのは人)。手での起動 (workflow_dispatch) は検査を待たずにビルドだけする。
# ビューア (apps/viewer) とスタジオ (apps/studio) も同じ手順でビルドできるので、アプリを行列に加えて一緒に作る (T0701・T0801)。
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# 呼ばれたとき (workflow_call) の github.workflow は呼んだ側の名前になるので、グループの名前は書いて決める
concurrency:
  group: editor-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # タグでないとき: environment を付けない。署名の Secrets は environment `release` にだけあるので空になり、署名せずに作る
  # (リポジトリの Secrets に残っていると署名してしまうので、移したら消す。docs/release.md#secrets-を置く-初回だけ人の手)
  build:
    name: build (${{ matrix.app }}, ${{ matrix.label }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # ジョブの要約の「Code signing」の表に出す、署名しなかった理由 (scripts/lib/app-signing.mjs)
      UGOE_UNSIGNED_REASON: not a v* tag (the signing secrets are only in the release environment)
    strategy: &build-strategy
      fail-fast: false
      matrix:
        app: [editor, viewer, studio]
        platform: [linux, windows, macos]
        include:
          - platform: linux
            os: ubuntu-latest
            label: linux-x86_64
            rust-targets: ""
          - platform: windows
            os: windows-latest
            label: windows-x86_64
            rust-targets: ""
          # Apple Silicon と Intel の両方で動く universal バイナリを 1 つの .dmg にする (app-build.mjs の macOS の既定)
          - platform: macos
            os: macos-latest
            label: macos-universal
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
    defaults: &build-defaults
      run:
        shell: bash
    steps: &build-steps
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain (rust-toolchain.toml, wasm32 target included)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add Rust targets
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}
      # Rust のキャッシュ (Swatinem/rust-cache) は使わない。タグの run で保存したキャッシュはそのタグからしか読めず、
      # アプリ × OS の 9 個のリリースビルドのキャッシュはリポジトリのキャッシュの上限 (10GB) を圧迫して ci.yml のキャッシュを
      # 消してしまう (docs/testing.md#ci-のキャッシュ)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: extractions/setup-just@v4
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版でなければならない
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # 出力先はアプリごとに違う (package.json の `wasm` スクリプト。エディタは `just wasm` と同じ)
      - name: Build ugoe-wasm
        run: pnpm --filter "@ugoe/${{ matrix.app }}" wasm
      # beforeBuildCommand (tauri.conf.json) でも `pnpm wasm` が走るが、ビルド済みなのですぐ終わる。
      # Windows でも just はレシピを windows-shell (PowerShell) で実行するので、手元の Windows と同じ経路になる。
      # Windows: Azure Artifact Signing (artifact-signing-cli が signtool と Azure CLI で署名する。どちらもランナーに入っている)。
      # Secrets が無ければ (タグでない build のジョブでも) UGOE_WINDOWS_SIGN_COMMAND を設定せず、署名しない
      - name: Set up Windows code signing
        if: runner.os == 'Windows'
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
        run: |
          if [ -z "$AZURE_CLIENT_SECRET" ]; then
            echo "No Windows signing secrets; building unsigned installers"
            exit 0
          fi
          cargo install artifact-signing-cli --version 0.11.0 --locked
          echo "UGOE_WINDOWS_SIGN_COMMAND=artifact-signing-cli -e $AZURE_ARTIFACT_SIGNING_ENDPOINT -d ugoe %1" >> "$GITHUB_ENV"
      # macOS: Tauri が APPLE_CERTIFICATE (.p12) を一時のキーチェーンに入れて署名し、APPLE_API_* で公証する。
      # API キー (.p8) は中身を Secrets に置き、ここでファイルに書いて APPLE_API_KEY_PATH で渡す
      - name: Set up macOS notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_API_PRIVATE_KEY" ]; then
            echo "No notarization key; the app is not notarized"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.app }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: just app::build TARGET=${{ matrix.app }} PLATFORM=${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: ugoe-${{ matrix.app }}-${{ matrix.label }}
          if-no-files-found: error
          path: target/dist/${{ matrix.app }}/${{ matrix.platform }}/

  # `v*` のタグのとき: environment `release` の Secrets で署名する。environment の Deployment branches and tags が
  # `v*` のタグに絞ってあるので、ほかの ref からは Secrets を読めない。deployment: false で、行列の 9 つのジョブごとに
  # デプロイメントを作らない (Secrets と保護の規則は効く)
  build-signed:
    name: build signed (${{ matrix.app }}, ${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: release
      deployment: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy: *build-strategy
    defaults: *build-defaults
    steps: *build-steps

  # `v*` のタグのときだけ、9 つのインストーラをそのタグの GitHub Release (下書き) に添付する。
  # ほかの配布物のワークフローと同じ下書きに添付する (scripts/github-release.mjs、docs/release.md#github-release-の下書き)。
  # Release を公開するのは人の手。
  release:
    name: attach to the draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-signed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: actions/download-artifact@v8
        with:
          pattern: ugoe-*
          path: dist
          merge-multiple: true
      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f | sort)
          printf '%s\n' "${files[@]}"
          node scripts/github-release.mjs upload "$GITHUB_REF_NAME" "${files[@]}"
