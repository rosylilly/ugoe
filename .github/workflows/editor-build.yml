name: Editor build

# エディタ・ビューア・スタジオのインストーラを各 OS のランナーでビルドし、成果物 (artifact) として置く。
# Tauri は他の OS 向けのクロスビルドが難しいので、OS ごとにネイティブでビルドする。
# (Linux から Windows 向けの NSIS だけを作る `just editor-build-windows` もあるが、MSI を作れないので CI では使わない。)
# 署名はしていない (apps/editor/README.md#配布物の署名)。
# ビューア (apps/viewer) とスタジオ (apps/studio) も同じ手順でビルドできるので、アプリを行列に加えて一緒に作る (T0701・T0801)。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.app }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: [editor, viewer, studio]
        platform: [linux-x86_64, windows-x86_64, macos-universal]
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            bundle-dir: target/release/bundle
            build-args: ""
            rust-targets: ""
          - platform: windows-x86_64
            os: windows-latest
            bundle-dir: target/release/bundle
            build-args: ""
            rust-targets: ""
          # Apple Silicon と Intel の両方で動く universal バイナリを 1 つの .dmg にする
          - platform: macos-universal
            os: macos-latest
            bundle-dir: target/universal-apple-darwin/release/bundle
            build-args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain (rust-toolchain.toml, wasm32 target included)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add Rust targets
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.app }}-build-${{ matrix.platform }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: extractions/setup-just@v4
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版でなければならない
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # 出力先はアプリごとに違う (package.json の `wasm` スクリプト。エディタは `just wasm` と同じ)
      - name: Build ugoe-wasm
        run: pnpm --filter "@ugoe/${{ matrix.app }}" wasm
      # beforeBuildCommand (tauri.conf.json) でも `pnpm wasm` が走るが、ビルド済みなのですぐ終わる。
      # Windows でも just はレシピを windows-shell (PowerShell) で実行するので、手元の Windows と同じ経路になる。
      - name: Build ${{ matrix.app }}
        run: just ${{ matrix.app }}-build ${{ matrix.build-args }}
      - name: List bundles
        run: find "${{ matrix.bundle-dir }}" -maxdepth 2 -type f -exec ls -l {} +
      - uses: actions/upload-artifact@v7
        with:
          name: ugoe-${{ matrix.app }}-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle-dir }}/deb/*.deb
            ${{ matrix.bundle-dir }}/rpm/*.rpm
            ${{ matrix.bundle-dir }}/appimage/*.AppImage
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/nsis/*.exe
            ${{ matrix.bundle-dir }}/dmg/*.dmg
