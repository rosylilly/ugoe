name: Unity

# Unity のパッケージ (bindings/unity): Unity に依存しない C# の層の検査と、各プラットフォームのネイティブライブラリ
# (ugoe-ffi) のビルド。ビルドしたライブラリを UPM パッケージに並べ、成果物として残す (公開はしない)。
# Windows・macOS のランナーを使い重いので、push・PR ごとには動かさない。release-checks.yml (手での起動・定期・リリースの前) が呼び、
# 単独でも手で起動できる (利用者の決定 2026-10-11。T0091)。
# - `v*` のタグ (release.yml が release-checks.yml を通して呼ぶ。docs/release.md) では、タグ・クレートの版・package.json の版が
#   揃っているかを確かめ、UPM の tarball (com.ugoe.unity-<版>.tgz と .sha256) を成果物 `com.ugoe.unity-tarball` に残す。
#   配る場所 (GitHub の Release など) に置くのは利用者が行う (bindings/unity/README.md#リリース)。tarball はほかの検査と並んで
#   作られるので、置くのは release.yml の run 全体が通ってから。
# Unity のエディタは使わない (bindings/unity/README.md#制限と確かめていないこと)。

on:
  workflow_call:
  workflow_dispatch:

# 呼ばれたとき (workflow_call) の github.workflow は呼んだ側の名前になるので、グループの名前は書いて決める
concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # .meta の検査・Runtime/Core の dotnet test (ホストの libugoe_ffi)・Unity の部分のスタブでの型検査 (netstandard2.1 と net48)。
  # `just unity-check` と同じ。
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Rust のキャッシュは使わない (下の native と同じ理由)
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - uses: extractions/setup-just@v4
      - name: Unity package
        run: just unity-check

  # 各プラットフォームの ugoe-ffi (リリースビルド)。ビルド (ターゲットごとの cargo・macOS の lipo とインストール名・ファイルの名前) は
  # scripts/ffi-dist.mjs の build-plugin が行い、C ABI の配布物 (ffi-release.yml) と共有する。ここは環境の用意とアップロードだけ。
  # matrix の name は ffi-dist.mjs の BUILDS の名前。成果物の名前と中の配置 (<name>/<ファイル>) は build.mjs の PLUGINS の from と揃う。
  # Rust のキャッシュ (Swatinem/rust-cache) は使わない。ugoe-ffi の依存は少なく、ビルドの時間の大半はキャッシュされない
  # ワークスペースのクレートなので、キャッシュがあっても速くならない (キャッシュ無しで 1 分、キャッシュありで 46 秒〜1 分 54 秒。
  # run 37468407995)。matrix の 1 つごとにキャッシュを持つと 7 個・約 1.5GB になり、リポジトリのキャッシュの上限 (10GB) を
  # 圧迫して ci.yml のキャッシュを消してしまう (T0051。docs/testing.md#ci-のキャッシュ)
  native:
    name: native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - name: macos-universal
            os: macos-14
            rust_target: aarch64-apple-darwin x86_64-apple-darwin
          - name: android-arm64-v8a
            os: ubuntu-24.04
            rust_target: aarch64-linux-android
            android: true
          - name: android-armeabi-v7a
            os: ubuntu-24.04
            rust_target: armv7-linux-androideabi
            android: true
          - name: android-x86_64
            os: ubuntu-24.04
            rust_target: x86_64-linux-android
            android: true
          - name: ios-arm64
            os: macos-14
            rust_target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add the Rust targets
        shell: bash
        run: rustup target add ${{ matrix.rust_target }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Install cargo-ndk
        if: matrix.android
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      # ランナーに入っている NDK を使う (ANDROID_NDK_LATEST_HOME)
      - name: Use the NDK of the runner
        if: matrix.android
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: node scripts/ffi-dist.mjs build-plugin --platform "${{ matrix.name }}" --out "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ugoe-ffi-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  # ネイティブライブラリを UPM パッケージ (com.ugoe.unity/Runtime/Plugins/) に並べ、.meta を作って成果物にする。
  # UPM の tarball も作る (タグでは版を確かめる)。
  package:
    needs: [check, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Check versions
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node bindings/unity/release.mjs check "$TAG"
      - uses: actions/download-artifact@v8
        with:
          pattern: ugoe-ffi-*
          path: plugins
          merge-multiple: true
      - name: Place the native libraries and the sample models
        run: node bindings/unity/build.mjs --plugins plugins
      - name: Pack the UPM tarball
        run: node bindings/unity/release.mjs pack dist
      - uses: actions/upload-artifact@v7
        with:
          name: com.ugoe.unity
          path: bindings/unity/com.ugoe.unity/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: com.ugoe.unity-tarball
          path: dist/
          if-no-files-found: error
