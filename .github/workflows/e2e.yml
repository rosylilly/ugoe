name: E2E

# 本物の Tauri のアプリ (エディタ・ビューア・スタジオ) を起動して操作する e2e テスト (`just e2e`。tests/e2e/README.md)。
# 3 つのアプリを Tauri でビルドし直すので重く、PR ごとの CI (ci.yml) には入れない。main への push・毎晩・手動で流す
# (利用者の決定 2026-10-03)。画面は Xvfb、WebView は WebKitGTK、WebDriver は WebKitWebDriver と tauri-driver。
# Windows と macOS は流さない (docs/testing.md#実機の-e2e-テスト)。
on:
  push:
    branches: [main]
  schedule:
    # 毎日 03:17 (UTC)
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # デバッグ情報を作らない (target がおよそ半分になる。ci.yml の rust-group と同じ)
  CARGO_PROFILE_DEV_DEBUG: "0"
  # tauri-driver の版 (docs/testing.md#実機の-e2e-テスト と揃える)
  TAURI_DRIVER_VERSION: 2.1.0

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /
      # Tauri のシステムの依存と、WebKitWebDriver・Xvfb・D-Bus・鍵の保管庫 (gnome-keyring。エディタの API キーの筋書き。
      # 無いと筋書きを飛ばすので、dpkg-query で入ったことを確かめる)・失敗したときの画面のスクリーンショット (xwd・ImageMagick)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb dbus gnome-keyring x11-apps imagemagick
          dpkg-query -W libwebkit2gtk-4.1-0 webkit2gtk-driver xvfb gnome-keyring
      - name: Install Rust toolchain (rust-toolchain.toml, wasm32 target included)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: extractions/setup-just@v4
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版でなければならない (アプリの beforeBuildCommand の `pnpm wasm`)
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Install tauri-driver
        run: cargo install tauri-driver --version "$TAURI_DRIVER_VERSION" --locked
      - name: E2E
        run: just e2e
      # 落ちたときに、スクリーンショット・ページの console・アプリと WebKitWebDriver のログを見られるように残す (実行ファイルは除く)
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            target/e2e
            !target/e2e/bin
            !target/e2e/*/xdg
