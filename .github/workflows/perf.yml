name: Perf

# 性能の検査 (`just perf`。docs/testing.md#遅くなったら気づく検査、T0191): `Puppet` の 1 フレームの評価
# (crates/ugoe/examples/puppet_timing.rs) を release で測り、中央値が上限を超えたら失敗する。共有のランナーでは時間が 2〜3 割揺れ、
# 関係の無い PR を落とさないように PR ごとの CI (ci.yml) には入れず、週に 1 度と手動で流す (利用者の決定 2026-10-08)。
on:
  schedule:
    # 毎週月曜 05:11 (UTC)。fuzz.yml (04:23)・nostd-build-std.yml (04:47) と少しずらす
    - cron: "11 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # release のビルドは ci.yml (dev のプロファイル) のキャッシュと成果物が違うので、キーを分ける
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf
      - uses: extractions/setup-just@v4
      # 上限を超えたときに、遅いのがランナーかコードかを見分けられるように CPU を残す
      - name: Show the CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core)'
      - name: Check the frame time
        run: just perf
