name: CI

# push・PR ごとの軽い検査 (手元の `just ci` に当たるもの。docs/testing.md#ci-のジョブ)。Linux のランナーだけで動かし、
# 変わったパスで Rust のグループとフロントエンドの検査を絞る (scripts/ci-groups.mjs の affected)。
# Windows・macOS・別のターゲット・GPU・適合テスト・Godot・e2e・Unity・perf・fuzz などの重い検査は push では動かさず、
# release-checks.yml (手での起動・定期・リリースの前) で流す (利用者の決定 2026-10-11。T0091)。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # デバッグ情報を作らない (target とキャッシュがおよそ半分になる)。パニックの位置はデバッグ情報がなくても表示される。
  # Swatinem/rust-cache は CARGO で始まる環境変数をキーに含めるので、キーを共有するジョブ (release-checks.yml の gpu と
  # rust (tools) など) で値を揃えるためにワークフロー全体に置く (release-checks.yml などにも同じ値を置く。docs/testing.md#ci-のキャッシュ)
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  # Rust の検査のうち、ワークスペースをビルドしないもの (cargo metadata だけを読む) と、文書の検査。
  # 変わったパスによらず常に動かす (文書だけの変更でも、見出しへの参照・文書のリンク・タスクのファイルを確かめる)
  rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # just licenses は npm の依存 (node_modules) も検査する (docs/adr/0029-shared-ui-and-i18n.md)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: extractions/setup-just@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Layers
        run: just layers
      # 大文字と小文字だけが違う名前 (macOS・Windows で同じファイルになる)
      - name: Case collisions
        run: just case-check
      # 機械に固有のパス (ホームのディレクトリ・エージェントの一時ディレクトリ。docs/release.md#公開の前の点検)
      - name: Local paths
        run: just local-paths
      # 秘密の値 (gitleaks。docs/release.md#自動の検査)。作業ツリーと、push・PR で入るコミットだけを見る (履歴のすべては見ない。
      # PR はマージのコミットの 1 つ目の親 (base) から、push は push の前のコミットから。浅い clone は scripts/secrets.mjs が深くする)
      - name: Secrets
        env:
          SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: just secrets --since "$SINCE"
      # コードから文書の見出しへの参照と、C ABI のヘッダとバインディングの宣言の突き合わせ
      - name: Refs
        run: just refs
      # すべてのクレートが、どれか 1 つのグループ (下の rust-group のジョブ) に入っているか
      - name: Groups
        run: just groups
      # アプリの表記の Rust のクレートの節は cargo-about で作る (docs/release.md#同梱物のライセンスの表記)。
      # 版は scripts/lib/rust-notices.mjs で決め、ビルドした実行ファイルを版ごとに覚える
      - name: Resolve cargo-about version
        id: cargo-about
        run: echo "version=$(just cargo-about-version)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo-about
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ runner.os }}-${{ steps.cargo-about.outputs.version }}
      - name: Install cargo-about
        run: just cargo-about
      - name: Licenses
        run: just licenses
      # crates.io に公開するクレートの準備 (メタデータ・LICENSE の写し・内部の依存の版。docs/release.md#cratesio)
      - name: Publish check
        run: just publish-check
      - name: Tasks
        run: just tasks > /dev/null
      # アプリのビルドの入口 (scripts/app-build.mjs) の引数と組み合わせ
      - name: App build check
        run: just app-build-check
      # 補助スクリプト (scripts/) の単体テスト。Node だけで動くので、ビルドしないこのジョブに置く (T0027)
      - name: Script check
        run: just script-check
      # UI の監査の道具 (tests/ui-audit) の単体テスト。監査そのもの (just ui-audit) はアプリのビルドが重いので流さない
      - name: UI audit check
        run: just ui-audit-check
      # 公開仕様の検査 (docs/spec/public-spec.md#同期の検査)。ajv を使うので pnpm install の後に置く
      - name: Specification
        run: node scripts/check-md-links.mjs docs spec && node scripts/check-spec.mjs
      # 公開仕様だけで書いた独立の読み込み器の型検査とテスト (tools/spec-check/README.md)
      - run: pnpm --filter ugoe-spec-check check
      - run: node --test tools/spec-check/test/

  # 変わったファイルから、動かす rust-group の matrix (scripts/ci-groups.mjs の GROUPS のうち、変わったクレートとそれに依存する
  # クレートのグループ) と、web を動かすかを決める (docs/testing.md#変わったパスでの絞り込み)。
  # push は push の前のコミット (github.event.before) から、PR は PR のマージのコミットの 1 つ目の親 (base) からの差分。
  # 前のコミットが取れなければ (新しいブランチ・履歴の書き換え) すべてを動かす
  rust-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
      rust: ${{ steps.groups.outputs.rust }}
      web: ${{ steps.groups.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      # ワークスペースのクレートのディレクトリと依存を cargo metadata で読む
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # 差分は 2 つのコミットの木を比べるだけなので、push の前のコミットは深さ 1 で取れば足りる
      - name: Fetch the commit before the push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BEFORE" || echo "could not fetch $BEFORE"
      - id: groups
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: node scripts/ci-groups.mjs changed "$BASE" HEAD >> "$GITHUB_OUTPUT"

  # clippy とテストを、クレートのグループごとの別のジョブで行う (docs/testing.md#ci-のジョブ)。
  # ワークスペース全体を 1 つのジョブでビルドすると、ランナーのディスク (空きは約 14GB) を超える。
  rust-group:
    name: rust (${{ matrix.group }})
    needs: rust-groups
    if: needs.rust-groups.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rust-groups.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # ランナーに入っている、使わない SDK を消してディスクを空ける
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Tauri system dependencies
        if: matrix.tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/rust-toolchain
      # キャッシュはグループごとに分け、main でだけ保存する (PR は main のキャッシュから始める)。
      # release-checks.yml の gpu は tools の、e2e.yml は apps のキャッシュを読む (docs/testing.md#ci-のキャッシュ)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: group-${{ matrix.group }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: extractions/setup-just@v4
      - name: Clippy
        run: just lint-group ${{ matrix.group }}
      - name: Test
        run: just test-group ${{ matrix.group }}
      # rustdoc の警告をエラーにして API ドキュメントを作る (`just doc-check` のグループの分。T0027)
      - name: Doc
        run: just doc-group ${{ matrix.group }}
      # Rust から生成した TS の型と JSON Schema がコミット済みで最新か (docs/editor.md#型の生成)。
      # エディタ (Tauri) の example でつくるので apps で行う
      - name: Generated files
        if: matrix.group == 'apps'
        run: just gen && git diff --exit-code
      # 参照レンダラを外した ugoe (`default-features = false`) が wgpu 無しでビルド・テストできるか (T0156)
      - name: ugoe without render
        if: matrix.group == 'runtime'
        run: just sdk-no-render-check
      # ランタイム層のクレートが std 無し (aarch64-unknown-none と、64 ビットのアトミック操作の無い thumbv7em-none-eabihf) で
      # ビルドできるか (`just nostd-check`。ADR 0031、T0179・T0070)。ターゲットは `nostd-check.mjs targets` が出すものをすべて入れる。
      # ugoe-ffi は std の無い形の静的ライブラリを C の見本とリンクし、未解決のシンボルがホストの C ライブラリのもの
      # (malloc・free・abort など) だけかも確かめる (T0491)。C の見本はランナーに入っている clang でコンパイルする
      - name: no_std
        if: matrix.group == 'runtime'
        run: |
          node scripts/nostd-check.mjs targets | xargs rustup target add
          just nostd-check
      # fuzz のクレート (fuzz/。ワークスペースの外で独自の Cargo.lock) を stable で検査する (`just fuzz-lint`: 依存のライセンス・
      # 整形・clippy。T0072)。ターゲットは ugoe・ugoe-format の公開 API と ugoe-ffi の fuzzing を使うので、変えて壊れたら release-checks.yml の fuzz を待たずに気づく。
      # ランタイムの API を変える PR が必ず流すこのジョブに置く。nightly と cargo-fuzz は要らない (計装したビルドは fuzz.yml)。
      # ビルドは fuzz/target で、rust-cache (target だけを持ち越す) の外: 依存は 50 ほどで、libfuzzer-sys のビルドスクリプトが
      # libFuzzer (C++。ランナーの g++ でコンパイルする) を含めても手元の 4 並列で約 10 秒なので、キャッシュは足さない。
      # ライセンスの検査と clippy は --locked で、ランタイムのクレートに依存を足して fuzz/Cargo.lock が古くなったらここで落ちる (fuzz/README.md)
      - name: Fuzz targets
        if: matrix.group == 'runtime'
        run: just fuzz-lint
      # wasm32 の clippy と、wasm32 でだけコンパイルするコード (`WebPuppet` など) の rustdoc の警告 (T0033)
      - name: wasm32
        if: matrix.group == 'bindings'
        run: just wasm-check
      # C ABI のヘッダが最新か、C の見本のビルドと実行 (crates/ugoe-ffi/README.md#ヘッダの生成)。std の無い形の静的ライブラリも
      # ホストの C ライブラリとリンクして実行する (crates/ugoe-ffi/README.md#std-の無い環境)。
      # cbindgen は MPL-2.0 なのでワークスペースの依存に入れず、版を固定した CLI を入れる (scripts/ffi.mjs と揃える)
      - name: Install cbindgen
        if: matrix.group == 'bindings'
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - name: C ABI
        if: matrix.group == 'bindings'
        run: just ffi-check
      - name: Disk usage
        if: always()
        run: |
          df -h /
          du -sh target || true

  # Rust の全ジョブの結果を 1 つにまとめる (ブランチの保護で必須にする検査の名前を、グループが増えても変えないため)。
  # 変わったパスで rust-group を飛ばしたとき (rust-groups の rust が false) は、飛ばしたことを成功とみなす
  rust:
    if: always()
    needs: [rust-checks, rust-groups, rust-group]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        if: >-
          needs.rust-checks.result != 'success' || needs.rust-groups.result != 'success' ||
          (needs.rust-group.result != 'success' &&
            (needs.rust-groups.outputs.rust == 'true' || needs.rust-group.result != 'skipped'))
        run: |
          echo "rust-checks: ${{ needs.rust-checks.result }}"
          echo "rust-groups: ${{ needs.rust-groups.result }} (rust: ${{ needs.rust-groups.outputs.rust }})"
          echo "rust-group: ${{ needs.rust-group.result }}"
          exit 1

  # フロントエンドは `just wasm` の生成物 (ugoe-wasm の JS バインディング) を読むので、
  # 先に wasm をビルドしてから、本物の型で検査・ビルドする。文書だけの変更では動かさない (rust-groups の web)
  web:
    needs: rust-groups
    if: needs.rust-groups.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm --filter @ugoe/editor test
      - run: pnpm --filter @ugoe/viewer test
      - run: pnpm --filter @ugoe/studio test
      - run: pnpm --filter @ugoe/face-tracking check
      - run: pnpm --filter @ugoe/face-tracking test
      - run: pnpm --filter @ugoe/player check
      - run: pnpm --filter @ugoe/player test
      - run: pnpm --filter @ugoe/i18n check
      - run: pnpm --filter @ugoe/i18n test
      # 翻訳のカタログの検査 (`just i18n`。packages/i18n/README.md)
      - run: node packages/i18n/scripts/check-catalogs.mjs
      - run: node --test --test-reporter=dot scripts/check-hardcoded-strings.test.mjs
      - run: node scripts/check-hardcoded-strings.mjs
      - run: pnpm --filter @ugoe/runtime test
      - name: Install Rust toolchain (rust-toolchain.toml, wasm32 target included)
        uses: ./.github/actions/rust-toolchain
      # ugoe-wasm の wasm32 のビルド (アプリの release と @ugoe/runtime の web-dist) のキャッシュ。main でだけ保存し、
      # e2e.yml (アプリの `pnpm wasm`) と web-runtime-release.yml (@ugoe/runtime) も読む (docs/testing.md#ci-のキャッシュ)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@v4
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版でなければならない
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Build ugoe-wasm
        run: just wasm
      # 手書きの型の写し (bindings/web のスタブ・@ugoe/player・@ugoe/face-tracking) を生成物と比べる
      - name: Compare the hand-written ugoe-wasm types with the generated
        run: just wasm-types apps/editor/src/lib/viewport/generated/ugoe_wasm.d.ts
      - run: pnpm --filter @ugoe/editor check
      - run: pnpm --filter @ugoe/editor build
      # ビューアは同じ wasm の JS バインディングを自分の src/lib/wasm/generated/ に生成する
      - name: Build ugoe-wasm for the viewer
        run: pnpm --filter @ugoe/viewer wasm
      - run: pnpm --filter @ugoe/viewer check
      - run: pnpm --filter @ugoe/viewer build
      # スタジオも同じ wasm の JS バインディングを自分の src/lib/wasm/generated/ に生成する (出力ウィンドウの受け手)
      - name: Build ugoe-wasm for the studio
        run: pnpm --filter @ugoe/studio wasm
      - run: pnpm --filter @ugoe/studio check
      - run: pnpm --filter @ugoe/studio build
      # npm パッケージ @ugoe/runtime (bindings/web。ADR 0025): wasm を生成して dist/ を作り、本物の型で検査する
      - run: pnpm --filter @ugoe/runtime build
      - run: pnpm --filter @ugoe/runtime check
