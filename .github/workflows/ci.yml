name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # デバッグ情報を作らない (target とキャッシュがおよそ半分になる)。パニックの位置はデバッグ情報がなくても表示される。
  # Swatinem/rust-cache は CARGO で始まる環境変数をキーに含めるので、キーを共有するジョブ (gpu と rust (tools) など) で
  # 値を揃えるためにワークフロー全体に置く (docs/testing.md#ci-のキャッシュ)
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  # Rust の検査のうち、ワークスペースをビルドしないもの (cargo metadata だけを読む)
  rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # just licenses は npm の依存 (node_modules) も検査する (docs/adr/0029-shared-ui-and-i18n.md)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: extractions/setup-just@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Layers
        run: just layers
      # コードから文書の見出しへの参照と、C ABI のヘッダとバインディングの宣言の突き合わせ
      - name: Refs
        run: just refs
      # すべてのクレートが、どれか 1 つのグループ (下の rust-group のジョブ) に入っているか
      - name: Groups
        run: just groups
      - name: Licenses
        run: just licenses
      # crates.io に公開するクレートの準備 (メタデータ・LICENSE の写し・内部の依存の版。docs/release.md#cratesio)
      - name: Publish check
        run: just publish-check
      - name: Tasks
        run: just tasks > /dev/null
      # アプリのビルドの入口 (scripts/app-build.mjs) の引数と組み合わせ
      - name: App build check
        run: just app-build-check
      # 補助スクリプト (scripts/) の単体テスト。Node だけで動くので、ビルドしないこのジョブに置く (T0027)
      - name: Script check
        run: just script-check
      # UI の監査の道具 (tests/ui-audit) の単体テスト。監査そのもの (just ui-audit) はアプリのビルドが重いので流さない
      - name: UI audit check
        run: just ui-audit-check

  # rust-group の matrix を scripts/ci-groups.mjs の GROUPS から作る (グループの定義は 1 か所に置く)
  rust-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - id: groups
        run: echo "matrix=$(node scripts/ci-groups.mjs matrix)" >> "$GITHUB_OUTPUT"

  # clippy とテストを、クレートのグループごとの別のジョブで行う (docs/testing.md#ci-のジョブ)。
  # ワークスペース全体を 1 つのジョブでビルドすると、ランナーのディスク (空きは約 14GB) を超える。
  rust-group:
    name: rust (${{ matrix.group }})
    needs: rust-groups
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rust-groups.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # ランナーに入っている、使わない SDK を消してディスクを空ける
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Tauri system dependencies
        if: matrix.tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # キャッシュはグループごとに分け、main でだけ保存する (PR は main のキャッシュから始める)。
      # gpu のジョブは tools のキャッシュを読む (docs/testing.md#ci-のキャッシュ)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: group-${{ matrix.group }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: extractions/setup-just@v4
      - name: Clippy
        run: just lint-group ${{ matrix.group }}
      - name: Test
        run: just test-group ${{ matrix.group }}
      # rustdoc の警告をエラーにして API ドキュメントを作る (`just doc-check` のグループの分。T0027)
      - name: Doc
        run: just doc-group ${{ matrix.group }}
      # Rust から生成した TS の型と JSON Schema がコミット済みで最新か (docs/editor.md#型の生成)。
      # エディタ (Tauri) の example でつくるので apps で行う
      - name: Generated files
        if: matrix.group == 'apps'
        run: just gen && git diff --exit-code
      # 参照レンダラを外した ugoe (`default-features = false`) が wgpu 無しでビルド・テストできるか (T0156)
      - name: ugoe without render
        if: matrix.group == 'runtime'
        run: just sdk-no-render-check
      # ランタイム層のクレートが std 無し (aarch64-unknown-none) でビルドできるか (`just nostd-check`。ADR 0031、T0179)
      - name: no_std
        if: matrix.group == 'runtime'
        run: |
          node scripts/nostd-check.mjs targets | xargs rustup target add
          just nostd-check
      # wasm32 の clippy と、wasm32 でだけコンパイルするコード (`WebPuppet` など) の rustdoc の警告 (T0033)
      - name: wasm32
        if: matrix.group == 'bindings'
        run: just wasm-check
      # C ABI のヘッダが最新か、C の見本のビルドと実行 (crates/ugoe-ffi/README.md#ヘッダの生成)。
      # cbindgen は MPL-2.0 なのでワークスペースの依存に入れず、版を固定した CLI を入れる (scripts/ffi.mjs と揃える)
      - name: Install cbindgen
        if: matrix.group == 'bindings'
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - name: C ABI
        if: matrix.group == 'bindings'
        run: just ffi-check
      - name: Disk usage
        if: always()
        run: |
          df -h /
          du -sh target || true

  # 手元の OS 以外のターゲットでの clippy (`just cross-check`、定義は scripts/cross-check.mjs の CHECKS)。
  # `#[cfg(windows)]`・`#[cfg(target_os = "macos")]` の中のコード (仮想カメラの unsafe など) は rust-group (ubuntu) では
  # コンパイルされないので、ubuntu のまま --target を変えて検査する。リンクしないので、ターゲットの標準ライブラリだけを足す
  cross:
    name: rust (cross)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Install Rust targets
        run: node scripts/cross-check.mjs targets | xargs rustup target add
      # 依存のビルドスクリプトがターゲット向けにコンパイルする C とリソースのためのツール (アプリの windows-gnu の MinGW)
      - name: Install cross tools
        run: |
          sudo apt-get update
          node scripts/cross-check.mjs apt | xargs sudo apt-get install -y --no-install-recommends
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@v4
      - name: Clippy
        run: just cross-check

  # Windows と macOS の上で、ファイルを扱うクレート (scripts/ci-groups.mjs の OS_CRATES) の clippy とテストを流す
  # (docs/testing.md#windows-と-macos)。大文字小文字を区別しないファイルシステムやパスの区切りの違いの誤りは
  # ubuntu では見つからない (T0667)。macOS では、Apple の SDK が要って rust (cross) で検査できないアプリの
  # src-tauri の macOS のコードを、`just lint-group apps` で検査する
  rust-os:
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # テストや clippy が落ちても依存のキャッシュを保存する。成功するまで保存しないと、落ち続ける間は毎回依存をすべて
      # ビルドする (Windows で約 16 分。T0051)。依存がそろうように、後の手順は前の手順が落ちても流す (`!cancelled()`)
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: extractions/setup-just@v4
      - name: Clippy
        run: just lint-os
      - name: Test
        if: ${{ !cancelled() }}
        run: just test-os
      - name: Clippy (apps)
        if: ${{ !cancelled() && matrix.name == 'macos' }}
        run: just lint-group apps

  # Rust の全ジョブの結果を 1 つにまとめる (ブランチの保護で必須にする検査の名前を、グループが増えても変えないため)
  rust:
    if: always()
    needs: [rust-checks, rust-groups, rust-group, cross, rust-os]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "rust-checks: ${{ needs.rust-checks.result }}"
          echo "rust-groups: ${{ needs.rust-groups.result }}"
          echo "rust-group: ${{ needs.rust-group.result }}"
          echo "cross: ${{ needs.cross.result }}"
          echo "rust-os: ${{ needs.rust-os.result }}"
          exit 1

  # 描画テスト (`just test-gpu`)。GPU のないランナーで Mesa のソフトウェア実装を使う。
  # vulkan: lavapipe / gl: llvmpipe (EGL)。gl は WebGL2 相当のバックエンドで動くことの確認。
  # ugoe-render などのテストだけをビルドするので、Tauri のシステム依存は入れない。
  gpu:
    name: gpu (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, gl]
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      # GL をハードウェアドライバではなく llvmpipe に固定する
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Mesa software rasterizers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Restrict Vulkan loader to lavapipe
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          echo "lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Show Vulkan devices
        if: matrix.backend == 'vulkan'
        run: vulkaninfo --summary
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # テストのビルドに要る依存は rust (tools) のビルドの依存に含まれる (T0051 で手元で確かめた) ので、そのキャッシュを読むだけにする
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: group-tools
          save-if: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: extractions/setup-just@v4
      # --nocapture でテストが選んだアダプタ (名前・ドライバ・バックエンド) をログに残す
      - name: GPU tests
        run: just test-gpu -- --nocapture

  # Godot のバインディング (bindings/godot。ワークスペースの外、ADR 0026): 依存のライセンス・ヘッドレスの Godot での
  # 動作 (smoke.gd)・`ugoe render` の画像との比べ合わせ (conformance.gd)。`just godot-check` と同じ。
  # 版を固定する: Godot は公式のビルド (SHA-512 を書いておいて確かめる)、Xvfb と Mesa はランナーの ubuntu-24.04 のもの。
  # Godot を上げるときは、リリースの SHA512-SUMS.txt の値に GODOT_SHA512 を書き換える。
  # Godot は Xvfb の上の llvmpipe (Compatibility / OpenGL) で、参照の画像 (ugoe render) は EGL の llvmpipe で描く。
  # 続けて適合テストを Forward+ (RenderingDevice の Vulkan) で lavapipe の上でも流し、最後に bench.gd で 1 フレームの時間を
  # 測って要約と成果物に残す (測るだけで、落ちてもジョブは落とさない。T0467)。
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_SHA512: 4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: gl
    steps:
      - uses: actions/checkout@v7
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1-mesa-dri libegl1 libegl-mesa0 libglx-mesa0 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libfontconfig1 \
            mesa-vulkan-drivers libvulkan1
          dpkg-query -W xvfb libgl1-mesa-dri mesa-vulkan-drivers
      # Godot の Forward+ (Vulkan) を lavapipe で動かす (参照の画像は WGPU_BACKEND=gl のまま)
      - name: Restrict Vulkan loader to lavapipe
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Install Godot
        run: |
          name="Godot_v${GODOT_VERSION}_linux.x86_64"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$name.zip"
          echo "$GODOT_SHA512  $name.zip" | sha512sum -c -
          unzip -q "$name.zip" -d godot
          echo "GODOT=$RUNNER_TEMP/godot/$name" >> "$GITHUB_ENV"
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # 参照の画像を描く ugoe のクレート (ugoe-cli・ugoe-conformance・ugoe-ffi) は conformance のジョブと同じビルドなので、
      # そのキャッシュを読むだけにする (ルートの target/)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          save-if: false
      # GDExtension (bindings/godot はワークスペースの外) は、CI では build.mjs が bindings/godot/target/ でビルドする。
      # rust-cache は保存の前に、そのワークスペースの依存でないものを target から消すので、ルートの target/ とは別のキャッシュにして
      # godot-rust などの依存を残す (docs/testing.md の「CI のキャッシュ」)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: godot-gdextension
          workspaces: bindings/godot -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: extractions/setup-just@v4
      - name: Godot binding
        run: just godot-check
      - name: Godot conformance (Forward+ on lavapipe)
        run: node bindings/godot/build.mjs --conformance --renderer forward_plus
      # 落ちたときに画像 (参照・Godot・違いの画像) を見られるように残す
      - name: Upload conformance results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: godot-conformance
          path: target/conformance
      # 1 フレームの時間 (bindings/godot/README.md の「検査」)。ランナーは共有の仮想機械なので、値は目安
      - name: Benchmark (bench.gd)
        continue-on-error: true
        run: |
          mkdir -p target/godot-bench
          node bindings/godot/build.mjs --release --bench | tee target/godot-bench/compatibility.txt
          node bindings/godot/build.mjs --release --bench --renderer forward_plus | tee target/godot-bench/forward_plus.txt
          for f in compatibility forward_plus; do
            echo "### bench.gd ($f)"
            echo '```'
            grep -E '^(godot |avatar|dress-up)' "target/godot-bench/$f.txt"
            echo '```'
          done >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: godot-bench
          path: target/godot-bench
          if-no-files-found: ignore

  # 配布物の適合テスト (tests/conformance/README.md、`just conformance`)。C ABI と wasm (npm パッケージ) の
  # 頂点と画像を、ModelInstance と `ugoe render` の参照と比べる。参照の画像は Mesa の lavapipe で、
  # wasm はヘッドレスの Chrome (ランナーに入っている) の WebGL2 (SwiftShader) で描く。
  # 続けて、エディタと Player が共有する PuppetSurface (`just player-browser`) とエディタの画面 (`just editor-browser`) を
  # ヘッドレスの Chrome で確かめる。
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
      - name: Install Mesa software rasterizers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Restrict Vulkan loader to lavapipe
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain (rust-toolchain.toml, wasm32 target included)
        run: rustup show active-toolchain || rustup toolchain install
      # godot と web のジョブもこのキャッシュを読む (docs/testing.md#ci-のキャッシュ)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@v4
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Conformance
        run: just conformance
      # PuppetSurface と Player (packages/player。GPL なので tests/conformance の外) を同じ Chrome と wasm で確かめる (T0936・T0939)。
      # 適合テストが落ちても流す (別のものを確かめるため)
      - name: PuppetSurface in the browser
        if: success() || failure()
        run: just player-browser
      # エディタの画面 (apps/editor。GPL) を同じ Chrome と wasm で、UI の監査の偽のホストを置いて確かめる (T1656)
      - name: Editor in the browser
        if: success() || failure()
        run: just editor-browser
      # 落ちたときに画像 (参照・各バインディング・違いの画像) と Chrome・ページのログを見られるように残す
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: |
            target/conformance
            target/player-browser/page.log
            target/editor-browser/page.log
            target/editor-browser/*-FAILED.png

  # フロントエンドは `just wasm` の生成物 (ugoe-wasm の JS バインディング) を読むので、
  # 先に wasm をビルドしてから、本物の型で検査・ビルドする。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      # 公開仕様の検査 (docs/spec/public-spec.md#同期の検査)。ajv を使うので pnpm install の後に置く
      - name: Specification
        run: node scripts/check-md-links.mjs docs spec && node scripts/check-spec.mjs
      # 公開仕様だけで書いた独立の読み込み器の型検査とテスト (tools/spec-check/README.md)
      - run: pnpm --filter ugoe-spec-check check
      - run: node --test tools/spec-check/test/
      - run: pnpm --filter @ugoe/editor test
      - run: pnpm --filter @ugoe/viewer test
      - run: pnpm --filter @ugoe/studio test
      - run: pnpm --filter @ugoe/face-tracking check
      - run: pnpm --filter @ugoe/face-tracking test
      - run: pnpm --filter @ugoe/player check
      - run: pnpm --filter @ugoe/player test
      - run: pnpm --filter @ugoe/i18n check
      - run: pnpm --filter @ugoe/i18n test
      # 翻訳のカタログの検査 (`just i18n`。packages/i18n/README.md)
      - run: node packages/i18n/scripts/check-catalogs.mjs
      - run: node --test --test-reporter=dot scripts/check-hardcoded-strings.test.mjs
      - run: node scripts/check-hardcoded-strings.mjs
      - run: pnpm --filter @ugoe/runtime test
      - name: Install Rust toolchain (rust-toolchain.toml, wasm32 target included)
        run: rustup show active-toolchain || rustup toolchain install
      # ugoe-wasm のビルド (release と web-dist) は conformance のジョブのビルドに含まれるので、そのキャッシュを読むだけにする
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          save-if: false
      - uses: extractions/setup-just@v4
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版でなければならない
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Build ugoe-wasm
        run: just wasm
      # 手書きの型の写し (bindings/web のスタブ・@ugoe/player・@ugoe/face-tracking) を生成物と比べる
      - name: Compare the hand-written ugoe-wasm types with the generated
        run: just wasm-types apps/editor/src/lib/viewport/generated/ugoe_wasm.d.ts
      - run: pnpm --filter @ugoe/editor check
      - run: pnpm --filter @ugoe/editor build
      # ビューアは同じ wasm の JS バインディングを自分の src/lib/wasm/generated/ に生成する
      - name: Build ugoe-wasm for the viewer
        run: pnpm --filter @ugoe/viewer wasm
      - run: pnpm --filter @ugoe/viewer check
      - run: pnpm --filter @ugoe/viewer build
      # スタジオも同じ wasm の JS バインディングを自分の src/lib/wasm/generated/ に生成する (出力ウィンドウの受け手)
      - name: Build ugoe-wasm for the studio
        run: pnpm --filter @ugoe/studio wasm
      - run: pnpm --filter @ugoe/studio check
      - run: pnpm --filter @ugoe/studio build
      # npm パッケージ @ugoe/runtime (bindings/web。ADR 0025): wasm を生成して dist/ を作り、本物の型で検査する
      - run: pnpm --filter @ugoe/runtime build
      - run: pnpm --filter @ugoe/runtime check
