name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: extractions/setup-just@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: just lint
      - name: Test
        run: just test
      - name: Layers
        run: just layers
      - name: Licenses
        run: just licenses
      - name: Tasks
        run: just tasks > /dev/null
      - name: wasm32
        run: just wasm-check

  # 描画テスト (`just test-gpu`)。GPU のないランナーで Mesa のソフトウェア実装を使う。
  # vulkan: lavapipe / gl: llvmpipe (EGL)。gl は WebGL2 相当のバックエンドで動くことの確認。
  # ugoe-render などのテストだけをビルドするので、Tauri のシステム依存は入れない。
  gpu:
    name: gpu (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, gl]
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      # GL をハードウェアドライバではなく llvmpipe に固定する
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Mesa software rasterizers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Restrict Vulkan loader to lavapipe
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          echo "lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Show Vulkan devices
        if: matrix.backend == 'vulkan'
        run: vulkaninfo --summary
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpu
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: extractions/setup-just@v4
      # --nocapture でテストが選んだアダプタ (名前・ドライバ・バックエンド) をログに残す
      - name: GPU tests
        run: just test-gpu -- --nocapture

  # フロントエンドは `just wasm` の生成物 (ugoe-wasm の JS バインディング) を読むので、
  # 先に wasm をビルドしてから、本物の型で検査・ビルドする。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm --filter @ugoe/editor test
      - name: Install Rust toolchain (rust-toolchain.toml, wasm32 target included)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - uses: extractions/setup-just@v4
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版でなければならない
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Build ugoe-wasm
        run: just wasm
      - run: pnpm --filter @ugoe/editor check
      - run: pnpm --filter @ugoe/editor build
