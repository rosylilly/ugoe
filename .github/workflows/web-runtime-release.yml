name: Web runtime release

# npm のパッケージ @ugoe/runtime (bindings/web。ADR 0025) を作り、npm に公開する。
# 手順と前提 (npm のアカウント・トークン・`private: true` の外し方) は bindings/web/README.md#リリース。
# - `v*` のタグで、release.yml が重い検査 (release-checks.yml) を通してから呼び、公開する (editor-build.yml と同じ。
#   すべての配布物の版を揃える。docs/portability.md)。タグ・クレートの版 (Cargo.toml の workspace.package.version)・
#   package.json の版が揃っていなければ失敗する。
# - 手で起動したときは、既定で `npm publish --dry-run` (公開しない)。`publish` を選ぶと公開する。
# - package.json が `private: true` のままなら、どちらでも公開せず、入る内容だけを表示する。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "npm に公開する (外すと npm publish --dry-run)"
        type: boolean
        default: false
  # release.yml (タグの push) から。github.event_name は呼んだ側の push になるので公開する
  workflow_call:

# 呼ばれたとき (workflow_call) の github.workflow は呼んだ側の名前になるので、グループの名前は書いて決める
concurrency:
  group: web-runtime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # ci.yml と同じ値にする (rust-cache のキーに入るので、違うと下のキャッシュを読めない)
  CARGO_PROFILE_DEV_DEBUG: "0"

permissions:
  contents: read
  # npm の provenance (来歴) と trusted publishing (OIDC) に使う
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check versions
        run: node bindings/web/scripts/release.mjs check ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Install Rust toolchain (rust-toolchain.toml, wasm32 target included)
        uses: ./.github/actions/rust-toolchain
      # ci.yml の web のジョブが main で保存したキャッシュ (@ugoe/runtime の web-dist を含む) を読むだけにする。
      # タグの run で保存したキャッシュはそのタグからしか読めないので保存しない (docs/testing.md#ci-のキャッシュ)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
          save-if: false
      - uses: extractions/setup-just@v4
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版でなければならない
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(just wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: pnpm --filter @ugoe/runtime build
      - run: pnpm --filter @ugoe/runtime check
      - run: pnpm --filter @ugoe/runtime test
      - run: node scripts/check-licenses.mjs
      - name: Publish
        working-directory: bindings/web
        env:
          # npm の trusted publishing を設定したなら不要 (OIDC で認証する)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          node scripts/release.mjs publish
          ${{ (github.event_name == 'push' || inputs.publish) && ' ' || '--dry-run' }}
