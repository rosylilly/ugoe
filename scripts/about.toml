# cargo-about (https://github.com/EmbarkStudios/cargo-about) の設定。配布物に入る Rust のクレートのライセンスの表記を作る
# (scripts/lib/rust-notices.mjs が `cargo about generate --format json` で読む。docs/release.md#同梱物のライセンスの表記)。
# 版は scripts/lib/rust-notices.mjs の CARGO_ABOUT_VERSION に固定する。

# 使ってよいライセンス。どのライセンスで使えるかの方針と検査は scripts/check-licenses.mjs (GPL_COMPATIBLE) が正で、ここはそれと同じ集合。
# 並びは優先の順: 選べるライセンス (`MIT OR Apache-2.0` など) は、前にあるものを使ったとして表記する。寛容なものを先に置き、
# その中では MIT を最初にする (JS のライブラリの表記と同じく、選べるなら MIT)。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]

# 配布するプラットフォーム (デスクトップアプリの Windows・macOS・Linux)。どれか 1 つのビルドに入るクレートを載せる。
# ほかのプラットフォームに出すもの (T1407 の Unity・Godot など) は `--target` で上書きする。
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# ビルドスクリプトだけが使うクレートとテストだけが使うクレートは、配布物に入らない
ignore-build-dependencies = true
ignore-dev-dependencies = true
