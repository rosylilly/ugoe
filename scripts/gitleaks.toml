# 秘密の値の検査 (gitleaks) の設定 (`just secrets`。scripts/secrets.mjs、docs/release.md#自動の検査)。
# gitleaks の既定の規則をすべて使い、秘密の値ではないと確かめたものだけを、理由を書いて外す。
# 外すときは、ファイルや規則ごとではなく、その値だけに絞る (同じ場所に本物の秘密の値が入っても見つかるように)。

[extend]
useDefault = true

[[allowlists]]
description = "WebSocket の RFC 6455 の例のキー"
# `Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==` は RFC 6455 の 1.3 節の例のキー ("the sample nonce" の base64) で、
# 秘密の値ではない。スタジオの WebSocket の受け答え (apps/studio/src-tauri/src/api/ws.rs) のテストと、その点検の記録
# (docs/tasks/T0090-pre-publication-audit.md) が使う。既定の規則 generic-api-key が API キーとみなす。
# https://www.rfc-editor.org/rfc/rfc6455#section-1.3
regexTarget = "match"
regexes = ['''Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==''']
