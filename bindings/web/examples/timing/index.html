<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebPuppet.update の計測</title>
    <!--
      wasm (ブラウザ) で 1 フレームの評価 (`WebPuppet.update` の 1 回) を測る (T0192、docs/testing.md#1-フレームの評価)。
      測り方はネイティブの crates/ugoe/examples/puppet_timing.rs と同じ: 60fps で FRAMES フレーム進め、BATCH フレームずつの平均の
      うち最も速いものと中央値を出す。入力 (頭と体の角度・目の開き・リップシンクの音量) は毎フレーム書き、ループするモーションを
      再生し続ける。時間は `update` (と `follow`) の呼び出しだけを測る (入力の書き込み・描画・GPU への転送・読み込みは含めない)。
      ?frames=6000&batch=200&backend=webgl2 で変えられる。結果は window.ugoeTiming (`done` が true になったら揃う)。
    -->
    <script type="importmap">
      {
        "imports": {
          "@ugoe/runtime": "./node_modules/@ugoe/runtime/dist/index.js"
        }
      }
    </script>
    <style>
      body {
        margin: 16px;
        font-family: system-ui, sans-serif;
        background: #f4f4f6;
        color: #222;
      }
      table {
        border-collapse: collapse;
        background: #fff;
        margin-bottom: 16px;
      }
      th,
      td {
        border: 1px solid #ccd;
        padding: 4px 8px;
        font-size: 13px;
      }
      td.number {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #status {
        font-size: 13px;
        color: #555;
      }
      canvas {
        width: 64px;
        height: 64px;
      }
    </style>
  </head>
  <body>
    <h1>WebPuppet.update の計測</h1>
    <p id="status">準備中…</p>
    <table>
      <tbody id="environment"></tbody>
    </table>
    <table>
      <thead>
        <tr>
          <th>モデル</th>
          <th>メッシュ</th>
          <th>頂点</th>
          <th>計測</th>
          <th>最速 (µs)</th>
          <th>中央値 (µs)</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
    <div id="canvases"></div>

    <script type="module">
      import { createPuppet, fetchModel, motionInfos, version } from "@ugoe/runtime";

      const query = new URLSearchParams(location.search);
      const FRAMES = Number(query.get("frames") ?? 6000);
      const BATCH = Number(query.get("batch") ?? 200);
      const backend = query.get("backend") ?? "auto";
      const DT = 1 / 60;
      // puppet_timing.rs の 2 つのモデル。生成のモデルは `--write` で書き出したもの (README の手順)
      const MODELS = [
        { name: "generated", url: "generated.ugoe" },
        { name: "avatar.ugoe", url: "samples/avatar.ugoe" },
      ];

      const state = { done: false, error: null, environment: null, results: [] };
      window.ugoeTiming = state;
      const status = document.getElementById("status");

      /** `performance.now()` の刻み (µs)。続けて読んで変わった差の最小。 */
      function timerResolution() {
        let smallest = Infinity;
        for (let i = 0; i < 50; i++) {
          const start = performance.now();
          let next = start;
          while (next === start) next = performance.now();
          smallest = Math.min(smallest, next - start);
        }
        return smallest * 1000;
      }

      /** フレーム `k` の、トラッキング相当の入力とリップシンクの音量を書く (puppet_timing.rs の `drive`)。 */
      function drive(puppet, k) {
        const t = k * DT;
        puppet.set_parameter("AngleX", 25 * Math.sin(t * 1.3));
        puppet.set_parameter("AngleY", 15 * Math.sin(t * 0.9 + 1));
        puppet.set_parameter("AngleZ", 10 * Math.cos(t * 0.7));
        puppet.set_parameter("BodyAngleX", 6 * Math.sin(t * 0.5));
        puppet.set_parameter("BodyAngleY", 4 * Math.cos(t * 0.4));
        const eye = 0.85 + 0.15 * Math.sin(t * 2.1);
        puppet.set_parameter("EyeLOpen", eye);
        puppet.set_parameter("EyeROpen", eye);
        const smile = 0.5 + 0.5 * Math.sin(t * 0.3);
        puppet.set_parameter("EyeLSmile", smile);
        puppet.set_parameter("EyeRSmile", smile);
        puppet.set_lip_sync_level(0.5 + 0.5 * Math.sin(t * 9));
      }

      /** モーションが終わっていたら (ループしないモーションの場合) 始め直す。 */
      function keepPlaying(puppet, motion) {
        if (motion && !puppet.is_motion_playing()) puppet.start_motion(motion, "force");
      }

      /** `BATCH` フレームずつの 1 フレームあたりの時間 (ms) から、(最も速いもの, 中央値) を µs で返す。 */
      function summary(averages) {
        const sorted = [...averages].sort((a, b) => a - b);
        return { best: sorted[0] * 1000, median: sorted[Math.floor(sorted.length / 2)] * 1000 };
      }

      /** 次の仕事の前に、ブラウザに処理を返す (画面の更新とほかの仕事のため。測る区間の外)。 */
      const yieldToBrowser = () => new Promise((done) => setTimeout(done, 0));

      async function createLoaded(model) {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        document.getElementById("canvases").append(canvas);
        const puppet = await createPuppet(canvas, { backend });
        await fetchModel(puppet, model.url);
        return puppet;
      }

      /** `update` を測る。`physics` が偽なら物理の段を止める。 */
      async function measureUpdate(model, motion, physics) {
        const puppet = await createLoaded(model);
        puppet.set_enabled("physics", physics);
        const averages = [];
        for (let k = 0; k < FRAMES; ) {
          let total = 0;
          for (let i = 0; i < BATCH; i++, k++) {
            keepPlaying(puppet, motion);
            drive(puppet, k);
            const start = performance.now();
            puppet.update(DT);
            total += performance.now() - start;
          }
          averages.push(total / BATCH);
          await yieldToBrowser();
        }
        puppet.render();
        puppet.free();
        return summary(averages);
      }

      /** 受け手の `follow` を測る。指揮役の `update` が配る値の列を先に記録しておき、それを順に渡す。 */
      async function measureFollow(model, motion) {
        const director = await createLoaded(model);
        const sent = [];
        for (let k = 0; k < FRAMES; k++) {
          keepPlaying(director, motion);
          drive(director, k);
          director.update(DT);
          const lipSync = director.lip_sync_applied();
          sent.push({
            values: director.values_before_physics(),
            lipSync,
            parts: director.part_opacities_applied_parts(),
            opacities: director.part_opacities_applied_values(),
          });
        }
        director.free();
        const receiver = await createLoaded(model);
        const averages = [];
        for (let k = 0; k < FRAMES; ) {
          let total = 0;
          for (let i = 0; i < BATCH; i++, k++) {
            const { values, lipSync, parts, opacities } = sent[k];
            const start = performance.now();
            receiver.follow(values, DT, lipSync?.[0], lipSync?.[1], parts, opacities);
            total += performance.now() - start;
          }
          averages.push(total / BATCH);
          await yieldToBrowser();
        }
        receiver.free();
        return summary(averages);
      }

      function row(cells) {
        const tr = document.createElement("tr");
        for (const [text, number] of cells) {
          const td = document.createElement("td");
          td.textContent = text;
          if (number) td.className = "number";
          tr.append(td);
        }
        return tr;
      }

      async function main() {
        // モデルの大きさと描画の API は、1 つ目のパペットで調べる
        const describe = [];
        let puppetBackend = null;
        let adapter = null;
        for (const model of MODELS) {
          const puppet = await createLoaded(model);
          puppet.update(DT);
          puppetBackend ??= puppet.backend();
          adapter ??= puppet.adapter_name();
          const ids = puppet.drawable_ids();
          let vertices = 0;
          for (let i = 0; i < ids.length; i++) vertices += puppet.drawable_positions(i).length / 2;
          const motions = motionInfos(puppet);
          const motion = (motions.find((m) => m.looping) ?? motions[0])?.name ?? null;
          describe.push({ ...model, meshes: ids.length, vertices, motion });
          puppet.free();
        }

        state.environment = {
          userAgent: navigator.userAgent,
          backend: puppetBackend,
          adapter,
          runtime: version(),
          crossOriginIsolated,
          timerResolutionUs: timerResolution(),
          hardwareConcurrency: navigator.hardwareConcurrency,
          frames: FRAMES,
          batch: BATCH,
        };
        const environment = document.getElementById("environment");
        for (const [key, value] of Object.entries(state.environment)) {
          environment.append(row([[key], [String(value)]]));
        }

        const results = document.getElementById("results");
        const measurements = [
          ["update", (m) => measureUpdate(m, m.motion, true)],
          ["follow", (m) => measureFollow(m, m.motion)],
          ["update without physics", (m) => measureUpdate(m, m.motion, false)],
        ];
        for (const model of describe) {
          for (const [name, measure] of measurements) {
            status.textContent = `測っています: ${model.name} の ${name}`;
            await yieldToBrowser();
            const { best, median } = await measure(model);
            const result = {
              model: model.name,
              meshes: model.meshes,
              vertices: model.vertices,
              motion: model.motion,
              measurement: name,
              best,
              median,
            };
            state.results.push(result);
            results.append(
              row([
                [model.name],
                [String(model.meshes), true],
                [String(model.vertices), true],
                [name],
                [best.toFixed(1), true],
                [median.toFixed(1), true],
              ]),
            );
          }
        }
        status.textContent = `終わりました (${FRAMES} フレームを ${BATCH} フレームずつ)`;
      }

      main()
        .catch((error) => {
          state.error = String(error?.stack ?? error);
          status.textContent = `失敗しました: ${error}`;
        })
        .finally(() => {
          state.done = true;
        });
    </script>
  </body>
</html>
