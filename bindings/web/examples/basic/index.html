<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@ugoe/runtime の見本</title>
    <!-- バンドラを使わないので、import map で node_modules のパッケージを指す。バンドラを使うなら不要 -->
    <script type="importmap">
      {
        "imports": {
          "@ugoe/runtime": "./node_modules/@ugoe/runtime/dist/index.js",
          "@ugoe/runtime/element": "./node_modules/@ugoe/runtime/dist/element.js"
        }
      }
    </script>
    <style>
      body {
        margin: 16px;
        font-family: system-ui, sans-serif;
        background: #f4f4f6;
        color: #222;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      section {
        background: #fff;
        border-radius: 8px;
        padding: 12px;
      }
      ugoe-avatar,
      #plain {
        width: 360px;
        height: 360px;
        background: #dfe6ee;
        border-radius: 4px;
      }
      #controls {
        width: 320px;
        max-height: 70vh;
        overflow: auto;
      }
      label {
        display: grid;
        grid-template-columns: 110px 1fr 48px;
        gap: 6px;
        align-items: center;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
        font-size: 13px;
      }
      .coefficients label {
        display: flex;
      }
      .coefficients input {
        width: 56px;
      }
      #filter-stats {
        font-size: 12px;
        color: #555;
        min-height: 1em;
      }
      #video {
        width: 160px;
        transform: scaleX(-1); /* 表示だけを鏡にする */
        border-radius: 4px;
      }
      #status {
        font-size: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>@ugoe/runtime</h1>
    <p id="status">読み込み中…</p>
    <main>
      <section>
        <h2>&lt;ugoe-avatar&gt;</h2>
        <!-- 属性だけで表示と初期のパラメータを決める -->
        <ugoe-avatar
          id="avatar"
          src="samples/avatar.ugoe"
          parameters="AngleX: 12; AngleY: -6"
        ></ugoe-avatar>
      </section>
      <section id="controls">
        <div class="row">
          <label style="display: flex">
            backend
            <select id="backend">
              <option value="auto">auto</option>
              <option value="webgpu">webgpu</option>
              <option value="webgl2">webgl2</option>
            </select>
          </label>
          <label style="display: flex"><input type="checkbox" id="paused" /> paused</label>
          <label style="display: flex"><input type="checkbox" id="tracking" /> tracking (合成の入力)</label>
          <label style="display: flex"><input type="checkbox" id="camera" /> camera (MediaPipe)</label>
        </div>
        <!-- 平滑化 (TrackingFilter) の係数。既定は @ugoe/runtime の既定と同じ -->
        <div class="row coefficients">
          <label>回転 minCutoff <input id="rotation-min-cutoff" type="number" step="0.1" min="0" value="1" /></label>
          <label>回転 beta <input id="rotation-beta" type="number" step="0.01" min="0" value="0.05" /></label>
          <label>表情 minCutoff <input id="blend-min-cutoff" type="number" step="0.1" min="0" value="1" /></label>
          <label>表情 beta <input id="blend-beta" type="number" step="0.1" min="0" value="2" /></label>
        </div>
        <p id="filter-stats"></p>
        <video id="video" muted playsinline hidden></video>
        <div class="row">
          <label style="display: flex">
            expression
            <select id="expression"><option value="">(なし)</option></select>
          </label>
          <label style="display: flex">
            motion
            <select id="motion"><option value="">(なし)</option></select>
          </label>
        </div>
        <div id="sliders"></div>
      </section>
      <section>
        <h2>API (createPuppet)</h2>
        <!-- Web Component を使わず、canvas に WebPuppet を直接作る -->
        <canvas id="plain"></canvas>
      </section>
    </main>

    <script type="module">
      import {
        createPuppet,
        fetchModel,
        initRuntime,
        TrackingFilter,
        trackingFromFaceLandmarker,
        version,
      } from "@ugoe/runtime";

      const query = new URLSearchParams(location.search);
      const backend = query.get("backend") ?? "auto";
      const avatar = document.getElementById("avatar");
      // ?src=samples/dress-up/dress-up.ugoe などでモデルを変える
      if (query.get("src")) avatar.setAttribute("src", query.get("src"));

      // WebGPU が使えない環境を真似る (WebGL2 への切り替えを試す。README の「WebGL2 への切り替えを試す」)。
      // - no-adapter: アダプタが無い → `auto` は同じ canvas で WebGL2 を使う
      // - device-error: アダプタはあるがデバイスの作成に失敗する → `auto` の作成が失敗し、新しい canvas の WebGL2 で作り直す
      const simulate = query.get("simulate");
      if (simulate === "no-adapter" && navigator.gpu) {
        navigator.gpu.requestAdapter = async () => null;
      } else if (simulate === "device-error" && globalThis.GPUAdapter) {
        GPUAdapter.prototype.requestDevice = async () => {
          throw new Error("simulated requestDevice failure");
        };
      }
      const status = document.getElementById("status");
      const result = { version: null, element: null, plain: null, errors: [] };
      await initRuntime();
      result.version = version();
      // ヘッドレスのブラウザでの確認用
      window.ugoeExample = result;

      const backendSelect = document.getElementById("backend");
      backendSelect.value = backend;
      avatar.setAttribute("backend", backend);
      // 属性を決めてから登録する (登録の後に backend を変えると作り直しになる)
      await import("@ugoe/runtime/element");
      backendSelect.addEventListener("change", () =>
        avatar.setAttribute("backend", backendSelect.value),
      );
      document
        .getElementById("paused")
        .addEventListener("change", (e) => (avatar.paused = e.target.checked));

      // フェイストラッキングの入力を渡す口 (setTracking)。入力は 2 通り:
      // - tracking (合成の入力): 時間の関数で作った入力に揺れを足したもの (カメラを使わない)
      // - camera (MediaPipe): カメラの映像を MediaPipe Face Landmarker (CDN から読む) で調べ、trackingFromFaceLandmarker で変換したもの
      // どちらも TrackingFilter で平滑化して毎フレーム渡す (?tracking-filter=off で平滑化しない)。
      // 平滑化の係数は画面の欄か URL (?rotation-min-cutoff=1&rotation-beta=0.05&blend-min-cutoff=1&blend-beta=2) で変えられる
      // (README の「平滑化の係数を実際の顔で調整する」)。
      const smooth = query.get("tracking-filter") !== "off";
      const coefficientInputs = ["rotation-min-cutoff", "rotation-beta", "blend-min-cutoff", "blend-beta"];
      for (const id of coefficientInputs) {
        const input = document.getElementById(id);
        if (query.get(id)) input.value = query.get(id);
        input.addEventListener("change", () => (trackingFilter = new TrackingFilter(filterOptions())));
      }
      /** 欄の値から TrackingFilter の係数を作る。 */
      function filterOptions() {
        const value = (id) => Number(document.getElementById(id).value);
        return {
          rotation: { minCutoff: value("rotation-min-cutoff"), beta: value("rotation-beta") },
          blendshapes: { minCutoff: value("blend-min-cutoff"), beta: value("blend-beta") },
        };
      }
      let trackingFilter = new TrackingFilter(filterOptions());

      // 揺れの目安: 頭のヨーのフレームごとの 2 階差分の絶対値の平均 (直近 60 フレーム)。止まった顔で小さいほど揺れが少ない
      const statsElement = document.getElementById("filter-stats");
      let history = [];
      function recordStats(raw, filtered) {
        history.push([raw.head?.yaw ?? 0, filtered.head?.yaw ?? 0]);
        if (history.length > 62) history.shift();
        if (history.length < 3) return;
        const roughness = (k) => {
          let sum = 0;
          for (let i = 2; i < history.length; i++) {
            sum += Math.abs(history[i][k] - 2 * history[i - 1][k] + history[i - 2][k]);
          }
          return sum / (history.length - 2);
        };
        const [rawYaw, filteredYaw] = history.at(-1);
        result.trackingStats = { raw: roughness(0), filtered: roughness(1) };
        statsElement.textContent =
          `ヨー 入力 ${rawYaw.toFixed(1)}° / 平滑化 ${filteredYaw.toFixed(1)}°、` +
          `揺れ (2 階差分の平均) 入力 ${result.trackingStats.raw.toFixed(2)} → 平滑化 ${result.trackingStats.filtered.toFixed(2)}`;
      }

      /** 入力を 1 フレーム渡す (平滑化と揺れの目安も)。 */
      function feedTracking(input, now) {
        const filtered = smooth ? trackingFilter.apply(input, now) : input;
        recordStats(input, filtered);
        avatar.setTracking(filtered);
      }

      // 今の入力を止める関数 (合成の入力とカメラは同時に使わない)
      let stopTracking = () => {};
      function startTracking(start) {
        stopTracking();
        trackingFilter.reset();
        history = [];
        stopTracking = start();
      }
      function endTracking() {
        stopTracking();
        stopTracking = () => {};
        avatar.clearTracking();
        statsElement.textContent = "";
      }

      document.getElementById("tracking").addEventListener("change", (e) => {
        if (!e.target.checked) return endTracking();
        document.getElementById("camera").checked = false;
        startTracking(() => {
          let frame = 0;
          const start = performance.now();
          const jitter = (amount) => (Math.random() - 0.5) * 2 * amount;
          const feed = (now) => {
            const t = (now - start) / 1000;
            const blink = t % 3 < 0.15 ? 1 : 0;
            feedTracking(
              {
                blendshapes: {
                  jawOpen: 0.5 + 0.5 * Math.sin(t * 3),
                  eyeBlinkLeft: blink,
                  eyeBlinkRight: blink,
                  mouthSmileLeft: 0.6,
                  mouthSmileRight: 0.6,
                },
                head: {
                  yaw: 20 * Math.sin(t) + jitter(3),
                  pitch: 10 * Math.sin(t * 0.7) + jitter(3),
                  roll: 8 * Math.sin(t * 1.3) + jitter(3),
                },
              },
              now,
            );
            frame = requestAnimationFrame(feed);
          };
          frame = requestAnimationFrame(feed);
          return () => cancelAnimationFrame(frame);
        });
      });

      // カメラ: MediaPipe Face Landmarker (Apache-2.0) を CDN から読む。パッケージは MediaPipe に依存しない
      const MEDIAPIPE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1";
      const FACE_MODEL =
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
      let landmarker = null;
      document.getElementById("camera").addEventListener("change", async (e) => {
        if (!e.target.checked) return endTracking();
        document.getElementById("tracking").checked = false;
        const video = document.getElementById("video");
        try {
          if (!landmarker) {
            statsElement.textContent = "MediaPipe を読み込み中…";
            const { FaceLandmarker, FilesetResolver } = await import(`${MEDIAPIPE}/vision_bundle.mjs`);
            const fileset = await FilesetResolver.forVisionTasks(`${MEDIAPIPE}/wasm`);
            landmarker = await FaceLandmarker.createFromOptions(fileset, {
              baseOptions: { modelAssetPath: FACE_MODEL },
              runningMode: "VIDEO",
              numFaces: 1,
              outputFaceBlendshapes: true,
              outputFacialTransformationMatrixes: true,
            });
          }
          video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
          await video.play();
          video.hidden = false;
        } catch (error) {
          e.target.checked = false;
          result.errors.push(String(error));
          statsElement.textContent = `カメラを使えません: ${error.message ?? error}`;
          return;
        }
        startTracking(() => {
          let frame = 0;
          let lastTime = -1;
          const detect = () => {
            const now = performance.now();
            if (video.currentTime !== lastTime) {
              lastTime = video.currentTime;
              // 映像は左右反転せずにトラッカーへ渡す (表示だけを CSS で反転している) ので mirrored は付けない
              const input = trackingFromFaceLandmarker(landmarker.detectForVideo(video, now));
              if (input) {
                feedTracking(input, now);
              } else {
                // 顔を見失った: フィルタを忘れる (最後の値を保つ)
                trackingFilter.reset();
                statsElement.textContent = "顔が見つかりません";
              }
              result.cameraFrames = (result.cameraFrames ?? 0) + 1;
            }
            frame = requestAnimationFrame(detect);
          };
          frame = requestAnimationFrame(detect);
          return () => {
            cancelAnimationFrame(frame);
            for (const track of video.srcObject?.getTracks() ?? []) track.stop();
            video.srcObject = null;
            video.hidden = true;
          };
        });
      });

      function fillSelect(id, names, attribute) {
        const select = document.getElementById(id);
        select.replaceChildren(new Option("(なし)", ""), ...names.map((n) => new Option(n, n)));
        select.value = avatar.getAttribute(attribute) ?? "";
        select.onchange = () =>
          select.value
            ? avatar.setAttribute(attribute, select.value)
            : avatar.removeAttribute(attribute);
      }

      function buildSliders() {
        const container = document.getElementById("sliders");
        container.replaceChildren();
        for (const def of avatar.parameterDefinitions) {
          if (def.internal) continue;
          const label = document.createElement("label");
          const input = document.createElement("input");
          const value = document.createElement("span");
          Object.assign(input, { type: "range", min: def.min, max: def.max, step: "any" });
          input.value = avatar.getParameter(def.id) ?? def.default;
          value.textContent = Number(input.value).toFixed(2);
          // JS から設定する
          input.addEventListener("input", () => {
            avatar.setParameter(def.id, Number(input.value));
            value.textContent = Number(input.value).toFixed(2);
          });
          label.append(def.name || def.id, input, value);
          container.append(label);
        }
      }

      avatar.addEventListener("load", (e) => {
        const { backend, warnings } = e.detail;
        result.element = { backend, warnings, parameters: avatar.parameters };
        status.textContent = `ugoe ${result.version}: <ugoe-avatar> は ${backend} で描画中 (警告 ${warnings.length} 件)`;
        fillSelect("expression", avatar.puppet.expression_names(), "expression");
        fillSelect("motion", avatar.puppet.motion_names(), "motion");
        buildSliders();
      });
      avatar.addEventListener("error", (e) => {
        result.errors.push(String(e.detail.error));
        status.textContent = `エラー: ${e.detail.error.message}`;
      });

      // 低い層の API: canvas と WebPuppet をホストが持ち、ループも自分で回す
      async function startPlain() {
        let canvas = document.getElementById("plain");
        const dpr = devicePixelRatio;
        canvas.width = canvas.clientWidth * dpr;
        canvas.height = canvas.clientHeight * dpr;
        let puppet;
        try {
          puppet = await createPuppet(canvas, { backend });
        } catch (e) {
          if (backend !== "auto") throw e;
          // 1 つの canvas は WebGPU と WebGL2 を併用できないので、新しい canvas の WebGL2 で作り直す
          console.warn("falling back to WebGL2:", e);
          const fresh = canvas.cloneNode();
          canvas.replaceWith(fresh);
          canvas = fresh;
          canvas.width = canvas.clientWidth * dpr;
          canvas.height = canvas.clientHeight * dpr;
          puppet = await createPuppet(canvas, { backend: "webgl2" });
        }
        const warnings = await fetchModel(puppet, "samples/dress-up/dress-up.ugoe");
        puppet.set_parameter("AngleX", -15);
        let last = performance.now();
        const frame = (now) => {
          puppet.update(Math.min((now - last) / 1000, 0.1));
          last = now;
          puppet.render();
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
        result.plain = { backend: puppet.backend(), warnings };
      }
      startPlain().catch((e) => {
        result.errors.push(String(e));
        status.textContent = `エラー: ${e.message ?? e}`;
      });
    </script>
  </body>
</html>
