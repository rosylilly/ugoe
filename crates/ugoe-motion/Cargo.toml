[package]
name = "ugoe-motion"
description = "ugoe モーション・表情・目パチ・呼吸・リップシンク・ポーズ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# crates.io に公開する (docs/adr/0027-crates-io-publishing.md)
publish = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ugoe", "animation", "motion", "lip-sync", "2d"]
categories = ["game-development", "multimedia"]

[features]
default = ["std"]
# std を使う。外しても公開 API は変わらない (no_std + alloc。docs/adr/0031-no-std-runtime-and-host-neutral-c-abi.md)
std = ["ugoe-core/std", "ugoe-model/std", "ugoe-runtime/std"]

[dependencies]
ugoe-core.workspace = true
ugoe-model.workspace = true
ugoe-runtime.workspace = true

[lints]
workspace = true
