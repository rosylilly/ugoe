[package]
name = "ugoe-ffi"
description = "ugoe の C ABI (Unity / Unreal / Godot 等への組み込み用)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde_json = { workspace = true, features = ["alloc"] }
ugoe.workspace = true
# テクスチャのデコード (`ugoe_image_decode`。参照・wasm と同じ `ugoe_format::image`。T0466)
ugoe-format.workspace = true

[dev-dependencies]
png.workspace = true

[features]
default = ["std"]
# std を使う。外すと `#![no_std]` (core + alloc) でビルドし、アロケータはホストの C ライブラリの `malloc`・`free` など、
# パニックは (`ugoe_set_panic_handler` で登録されたホストの関数にメッセージを渡してから) `abort` になる。関数の集合とヘッダは変わらないが、PNG と BCn のテクスチャのデコードは std の側にある
# (crates/ugoe-ffi/README.md#std-の無い環境。docs/adr/0031-no-std-runtime-and-host-neutral-c-abi.md)
std = ["serde_json/std", "ugoe/std", "ugoe-format/png"]
# テスト用。std の無い形に、わざとパニックする `ugoe_test_panic` を足す (ヘッダには出さない)。`just ffi-check` が
# パニックのメッセージがホストの関数に届いてから abort することを確かめるのに使う。配る静的ライブラリでは有効にしない
panic-test = []
# fuzz 用。入力を C ABI の呼び出しの列に組み立てて回す安全な入口 `ugoe_ffi::fuzzing` を足す (ヘッダには出さない)。
# fuzz のターゲット (fuzz/fuzz_targets/ffi.rs) が使う。配るライブラリでは有効にしない (docs/testing.md#fuzz)
fuzzing = []

[lints]
workspace = true

[[test]]
name = "fuzzing"
required-features = ["fuzzing"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
