[package]
name = "ugoe-ffi"
description = "ugoe の C ABI (Unity / Unreal / Godot 等への組み込み用)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde_json = { workspace = true, features = ["alloc"] }
ugoe.workspace = true
# テクスチャのデコード (`ugoe_image_decode`。参照・wasm と同じ `ugoe_format::image`。T0466)
ugoe-format.workspace = true

[dev-dependencies]
png.workspace = true

[features]
default = ["std"]
# std を使う。外すと `#![no_std]` (core + alloc) でビルドし、アロケータはホストの C ライブラリの `malloc`・`free` など、
# パニックは `abort` になる。関数の集合とヘッダは変わらないが、PNG と BCn のテクスチャのデコードは std の側にある
# (crates/ugoe-ffi/README.md#std-の無い環境。docs/adr/0031-no-std-runtime-and-host-neutral-c-abi.md)
std = ["serde_json/std", "ugoe/std", "ugoe-format/png"]

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
