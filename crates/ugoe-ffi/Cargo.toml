[package]
name = "ugoe-ffi"
description = "ugoe の C ABI (Unity / Unreal / Godot 等への組み込み用)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde_json = { workspace = true, features = ["std"] }
ugoe = { workspace = true, default-features = false }
# テクスチャのデコード (`ugoe_image_decode`。参照・wasm と同じ `ugoe_format::image`。T0466)
ugoe-format = { workspace = true, features = ["png"] }

[dev-dependencies]
png.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
