# include/ugoe.h の生成設定 (cbindgen の CLI で生成する。手順は README.md)。
# cbindgen は MPL-2.0 なので、ワークスペースの依存 (build-dependencies を含む) には入れない。
language = "C"
header = "/* SPDX-License-Identifier: MIT */"
include_guard = "UGOE_H"
autogen_warning = "/* This file is generated by cbindgen from crates/ugoe-ffi. Do not edit it by hand; run `just ffi-header`. */"
# cbindgen の版はヘッダに書かない (版は scripts/ffi.mjs の CBINDGEN_VERSION で固定し、そちらで確かめる)。
include_version = false
cpp_compat = true
style = "both"
usize_is_size_t = true
documentation = true
documentation_style = "c99"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export.rename]
"ABI_VERSION" = "UGOE_ABI_VERSION"

[parse]
parse_deps = false
