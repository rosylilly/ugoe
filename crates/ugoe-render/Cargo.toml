[package]
name = "ugoe-render"
description = "ugoe 参照レンダラ (wgpu)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# crates.io に公開する (docs/adr/0027-crates-io-publishing.md)
publish = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ugoe", "animation", "wgpu", "webgpu", "2d"]
categories = ["rendering", "graphics", "game-development"]

[dependencies]
bytemuck.workspace = true
thiserror.workspace = true
tracing.workspace = true
ugoe-core.workspace = true
ugoe-model.workspace = true
ugoe-runtime.workspace = true
wgpu.workspace = true

[lints]
workspace = true

[features]
# Web で WebGPU 非対応環境 (Linux の WebKitGTK 等) 向けの WebGL2 フォールバック。
webgl = ["wgpu/webgl"]
# 実 GPU (またはソフトウェアラスタライザ) を必要とする描画テストを有効にする。
gpu-tests = []

[dev-dependencies]
# glsl-out: 参照シェーダが WebGL2 (GLSL ES 3.00) に変換できることを確かめる。
naga = { workspace = true, features = ["glsl-out"] }
png.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
# png: 描画の例の PNG のテクスチャを参照実装の読み込みで読む (tests/spec_render.rs)。
ugoe-format = { workspace = true, features = ["png"] }
