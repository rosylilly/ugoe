[package]
name = "ugoe-core"
description = "ugoe 共通基盤: 数学型・ID・色・エラー"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# crates.io に公開する (docs/adr/0027-crates-io-publishing.md)
publish = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ugoe", "animation", "rigging", "2d", "math"]
categories = ["graphics", "game-development", "mathematics"]

# コード生成用 (T0603)。ランタイムは使わないので既定では無効。ugoe-editor-core が有効にする。
[features]
# schemars::JsonSchema を実装する (AI ツール定義の JSON Schema)
schema = ["dep:schemars"]
# ts_rs::TS を実装する (エディタの TypeScript の型)
ts = ["dep:ts-rs"]

[dependencies]
glam.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
