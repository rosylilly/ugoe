[package]
name = "ugoe-core"
description = "ugoe 共通基盤: 数学型・ID・色"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# crates.io に公開する (docs/adr/0027-crates-io-publishing.md)
publish = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ugoe", "animation", "rigging", "2d", "math"]
categories = ["graphics", "game-development", "mathematics"]

[features]
default = ["std"]
# std を使う。外しても公開 API は変わらない (no_std + alloc。docs/adr/0031-no-std-runtime-and-host-neutral-c-abi.md)
std = ["glam/std", "serde/std"]
# コード生成用 (T0603)。ランタイムは使わないので既定では無効。ugoe-editor-core が有効にする。
# schemars::JsonSchema を実装する (AI ツール定義の JSON Schema)
schema = ["std", "dep:schemars"]
# ts_rs::TS を実装する (エディタの TypeScript の型)
ts = ["std", "dep:ts-rs"]

[dependencies]
# std が無いときの数学関数は libm (std があるときは std のものを使う。T0180 で常に libm にする)
glam = { workspace = true, features = ["nostd-libm"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["alloc"] }
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
