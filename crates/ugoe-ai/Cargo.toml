[package]
name = "ugoe-ai"
description = "AI 連携: モデルプロバイダ抽象と自動リギングパイプライン"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
png.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
ugoe-core = { workspace = true, features = ["std"] }
ugoe-editor-core.workspace = true
ugoe-model = { workspace = true, features = ["std"] }
ugoe-psd.workspace = true
ugoe-rigging.workspace = true
ugoe-runtime = { workspace = true, features = ["std"] }
ureq.workspace = true

[dev-dependencies]
pollster.workspace = true
# M6 の受け入れテスト (tests/m6_acceptance.rs) で、採用したモデルをランタイム SDK で動かす
ugoe.workspace = true
ugoe-core = { workspace = true, features = ["std"] }
ugoe-render.workspace = true
wgpu.workspace = true

[features]
# 生成した法線マップを参照レンダラで描くテスト (実 GPU かソフトウェアラスタライザが要る)。`just test-gpu` で実行する。
gpu-tests = []

[lints]
workspace = true
