[package]
name = "ugoe-format"
description = "ugoe ファイル形式 (ランタイムバンドル .ugoe / モーション JSON) の読み書き"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# crates.io に公開する (docs/adr/0027-crates-io-publishing.md)
publish = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ugoe", "animation", "rigging", "file-format", "2d"]
categories = ["graphics", "game-development", "encoding", "parser-implementations"]

[dependencies]
bcdec_rs = { workspace = true, optional = true }
png = { workspace = true, optional = true }
rmp-serde.workspace = true
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ugoe-model.workspace = true

[dev-dependencies]
png.workspace = true
ugoe-core.workspace = true
# 結合テスト (tests/spec_bundles.rs) で `image` モジュールを使うために、自分の `png` feature を有効にする
ugoe-format = { path = ".", features = ["png"] }
# 互換性テスト (tests/compat.rs) で、未知の物理の出力を無視することを確かめる
ugoe-physics.workspace = true
ugoe-runtime.workspace = true

[features]
# テクスチャの PNG と KTX2 のデコード (`image` モジュール。KTX2 は圧縮していない 8bit の RGB / RGBA と BCn。
# BCn は bcdec_rs で展開する。docs/adr/0030-compressed-ktx2-decoding.md)。
png = ["dep:bcdec_rs", "dep:png"]

[lints]
workspace = true
