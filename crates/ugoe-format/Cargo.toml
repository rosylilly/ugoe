[package]
name = "ugoe-format"
description = "ugoe ファイル形式 (ランタイムバンドル .ugoe / モーション JSON) の読み書き"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# crates.io に公開する (docs/adr/0027-crates-io-publishing.md)
publish = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ugoe", "animation", "rigging", "file-format", "2d"]
categories = ["graphics", "game-development", "encoding", "parser-implementations"]

[dependencies]
png = { workspace = true, optional = true }
rmp-serde.workspace = true
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ugoe-model.workspace = true

[dev-dependencies]
png.workspace = true
ugoe-core.workspace = true
ugoe-runtime.workspace = true

[features]
# テクスチャの PNG のデコード (`image` モジュール)。
png = ["dep:png"]

[lints]
workspace = true
