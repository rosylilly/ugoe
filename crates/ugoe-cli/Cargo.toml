[package]
name = "ugoe-cli"
description = "ugoe コマンドラインツール (検証・ビルド・スナップショット描画)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json = { workspace = true, features = ["std"] }
ugoe = { workspace = true, features = ["render"] }
ugoe-core = { workspace = true, features = ["std"] }
ugoe-editor-core.workspace = true
ugoe-format = { workspace = true, features = ["std"] }
ugoe-fs.workspace = true
ugoe-headless = { workspace = true, features = ["clap"] }
ugoe-model = { workspace = true, features = ["std"] }
ugoe-psd.workspace = true
ugoe-rigging.workspace = true
ugoe-runtime = { workspace = true, features = ["std"] }

[dev-dependencies]
png.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
# 実 GPU (またはソフトウェアラスタライザ) を必要とする描画テストを有効にする。
gpu-tests = []

# bin の名前が SDK (`ugoe` クレート) の lib と同じなので、`cargo doc --workspace` では出力先 (`target/doc/ugoe/`) が衝突する。
# cargo は rustdoc の前に `target/doc/<クレート>` を消すので、並行する 2 つの rustdoc が互いの出力を消しうる
# (<https://github.com/rust-lang/cargo/issues/6313>)。CLI の使い方は `ugoe --help` と README にあるので、bin の API ドキュメントは作らない (T0033)
[[bin]]
name = "ugoe"
path = "src/main.rs"
doc = false
