[package]
name = "ugoe-mcp"
description = "MCP サーバ: 外部のエージェントから .ugoeproj を読み、Command の提案と適用を行う"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ugoe-ai.workspace = true
ugoe-editor-core.workspace = true
ugoe-format.workspace = true
ugoe-headless.workspace = true
ugoe-model.workspace = true
ugoe-psd.workspace = true

[dev-dependencies]
# HTTP のトランスポートのテストのクライアント (ワークスペースで ugoe-ai が使っているもの)。
ureq.workspace = true

[lints]
workspace = true

[features]
# 実 GPU (またはソフトウェアラスタライザ) で render_png を確かめるテストを有効にする。
gpu-tests = []

[[bin]]
name = "ugoe-mcp"
path = "src/main.rs"
