[package]
name = "ugoe-mcp"
description = "MCP サーバ: 外部のエージェントから .ugoeproj を読み、Command の提案と適用を行う"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
# `.mcpb` (zip) の deflate (ugoe-psd が使っているもので、新しい依存ではない)。
miniz_oxide.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
ugoe-ai.workspace = true
ugoe-editor-core.workspace = true
ugoe-format.workspace = true
ugoe-fs.workspace = true
ugoe-headless.workspace = true
ugoe-model = { workspace = true, features = ["std"] }
ugoe-psd.workspace = true
# `--editor` の中継がエディタへ送る HTTP のクライアント (ugoe-ai が使っているもので、新しい依存ではない)。
ureq.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[features]
# 実 GPU (またはソフトウェアラスタライザ) で render_png を確かめるテストを有効にする。
gpu-tests = []

[[bin]]
name = "ugoe-mcp"
path = "src/main.rs"
