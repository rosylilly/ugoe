[package]
name = "ugoe-wasm"
description = "ugoe の WebAssembly バインディング (Web ビューア・エディタのビューポート)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
ugoe = { workspace = true, features = ["render"] }
ugoe-format = { workspace = true, features = ["png"] }
ugoe-render = { workspace = true, features = ["webgl"] }
wasm-bindgen.workspace = true
wgpu.workspace = true

# ブラウザの canvas とサーフェスを扱う部分 (`src/web.rs`) だけが使う。
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "WebGl2RenderingContext", "console"] }

[dev-dependencies]
png.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
