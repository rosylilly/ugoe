[package]
name = "ugoe-runtime"
description = "ugoe ランタイム評価: パラメータ → キーフォーム補間 → デフォーマ変形 → 描画可能状態"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# crates.io に公開する (docs/adr/0027-crates-io-publishing.md)
publish = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ugoe", "animation", "rigging", "deformation", "2d"]
categories = ["graphics", "game-development"]

[dependencies]
glam = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
ugoe-core = { workspace = true, features = ["std"] }
ugoe-model = { workspace = true, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
insta.workspace = true
serde_json = { workspace = true, features = ["std"] }
