[package]
name = "ugoe-runtime"
description = "ugoe ランタイム評価: パラメータ → キーフォーム補間 → デフォーマ変形 → 描画可能状態"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# crates.io に公開する (docs/adr/0027-crates-io-publishing.md)
publish = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ugoe", "animation", "rigging", "deformation", "2d"]
categories = ["graphics", "game-development"]

[features]
default = ["std"]
# std を使う。外しても公開 API は変わらない (no_std + alloc。docs/adr/0031-no-std-runtime-and-host-neutral-c-abi.md)
std = ["glam/std", "serde/std", "thiserror/std", "ugoe-core/std", "ugoe-model/std"]

[dependencies]
glam.workspace = true
serde = { workspace = true, features = ["alloc"] }
thiserror.workspace = true
ugoe-core.workspace = true
ugoe-model.workspace = true

[lints]
workspace = true

[dev-dependencies]
insta.workspace = true
serde_json = { workspace = true, features = ["std"] }
