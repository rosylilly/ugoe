# ランタイム層のクレートの clippy の設定。ルートの clippy.toml と同じ設定に、数学関数の禁止を足したもの
# (clippy は最も近い clippy.toml だけを読むので、ルートの設定も写す)。
# std の f32・f64 の数学関数は std にしか無く、OS の数学ライブラリで結果が変わりうるので、ugoe_core::math (常に libm) を通す
# (docs/adr/0031-no-std-runtime-and-host-neutral-c-abi.md#数学関数は-libm-に寄せる)。
# 同じ内容のファイルを置くクレートは scripts/nostd-check.mjs の MATH_CRATES で、内容が揃っているかは `just groups` が検査する。
allow-unwrap-in-tests = true
allow-expect-in-tests = true
disallowed-methods = [
  { path = "f32::floor", reason = "ugoe_core::math::floor を使う (std の有無と OS にかかわらず libm。ADR 0031)" },
  { path = "f32::ceil", reason = "ugoe_core::math::ceil を使う (std の有無と OS にかかわらず libm。ADR 0031)" },
  { path = "f32::round", reason = "ugoe_core::math::round を使う (std の有無と OS にかかわらず libm。ADR 0031)" },
  { path = "f32::round_ties_even", reason = "ugoe_core::math に libm を呼ぶ関数を足して使う (ADR 0031)" },
  { path = "f32::trunc", reason = "ugoe_core::math::trunc を使う (std の有無と OS にかかわらず libm。ADR 0031)" },
  { path = "f32::fract", reason = "ugoe_core::math に libm を呼ぶ関数を足して使う (ADR 0031)" },
  { path = "f32::mul_add", reason = "ugoe_core::math に libm を呼ぶ関数を足して使う (ADR 0031)" },
  { path = "f32::div_euclid", reason = "ugoe_core::math に libm を呼ぶ関数を足して使う (ADR 0031)" },
  { path = "f32::rem_euclid", reason = "ugoe_core::math::rem_euclid を使う (std の有無と OS にかかわらず libm。ADR 0031)" },
  { path = "f32::powi", reason = "ugoe_core::math に libm を呼ぶ関数を足して使う (ADR 0031)" },
  { path = "f32::powf", reason = "ugoe_core::math::powf を使う (std の有無と OS にかかわらず libm。ADR 0031)" },
  { path = "f32::sqrt", reason = "ugoe_core::math::sqrt を使う (std の有無と OS にかかわらず libm。ADR 0031)" },
  { path = "f32::exp", reason = "ugoe_core::math::exp を使う (std の有無と OS にかかわらず libm。ADR 0031)" },
  { path = "f32::exp2", reason = "ugoe_core::math に libm を呼ぶ関数を足して使う (ADR 0031)" },
  { path = "f32::exp_m1", reason = "ugoe_core::math に libm を呼ぶ関数を足して使う (ADR 0031)" },
  { path = "f32::ln", reason = "ugoe_core::math::ln を使う (std の有無と OS にかかわらず libm。ADR 0031)" },
  { path = "f32::ln_1p", reason = "ugoe_core::math に libm を呼ぶ関数を足して使う (ADR 0031)" },
  { path = "f32::log", reason = "ugoe_core::math に libm を呼ぶ関数を足して使う (ADR 0031)" },
