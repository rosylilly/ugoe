[package]
name = "ugoe-model"
description = "ugoe のデータ定義 (モデル・物理・モーション・表情)。アルゴリズムは持たない"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# コード生成用 (T0603)。ランタイムは使わないので既定では無効。ugoe-editor-core が有効にする。
[features]
# schemars::JsonSchema を実装する (AI ツール定義の JSON Schema)
schema = ["dep:schemars", "dep:serde_json", "ugoe-core/schema"]
# ts_rs::TS を実装する (エディタの TypeScript の型)
ts = ["dep:ts-rs", "ugoe-core/ts"]

[dependencies]
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
ugoe-core.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "spec_files"
required-features = ["schema"]

[[test]]
name = "spec_files"
required-features = ["schema"]

[lints]
workspace = true
