[package]
name = "ugoe"
description = "ugoe ランタイム SDK ファサード (ゲームエンジン・アプリ組み込み向けの高水準 API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# crates.io に公開する (docs/adr/0027-crates-io-publishing.md)
publish = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["animation", "rigging", "vtuber", "puppet", "2d"]
categories = ["game-development", "graphics", "rendering"]

[dependencies]
ugoe-core = { workspace = true, features = ["std"] }
ugoe-format.workspace = true
ugoe-model = { workspace = true, features = ["std"] }
ugoe-motion.workspace = true
ugoe-physics.workspace = true
ugoe-render = { workspace = true, optional = true }
ugoe-runtime.workspace = true
thiserror = { workspace = true, features = ["std"] }

[features]
default = ["render"]
# 参照レンダラ (`ugoe::render`、wgpu)。エンジン独自のレンダラで描く組み込み先は `default-features = false` で外す (T0156)
render = ["dep:ugoe-render"]

[dev-dependencies]
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
