[workspace]
resolver = "3"
members = ["crates/*", "apps/editor/src-tauri", "apps/viewer/src-tauri", "apps/studio/src-tauri", "apps/studio/vcam", "tests/conformance"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/rosylilly/ugoe"
# 既定では公開しない。crates.io に公開するクレートだけ `publish = true` にする (docs/adr/0027-crates-io-publishing.md)。
publish = false
license = "MIT"

# 依存は必ずここで宣言し、各クレートでは `foo.workspace = true` で参照する。
# マージ衝突を減らすため 1 行 1 依存・アルファベット順を守ること。
[workspace.dependencies]
# --- internal ---
# crates.io に公開するクレート (publish = true) は、path に加えて version を書く (公開したパッケージでは version だけが残る)。
# version は [workspace.package] の version と揃える (`node scripts/crates.mjs sync`。docs/release.md)。
# ugoe の既定の feature (render = wgpu) は切ってある。参照レンダラを使うクレートは `features = ["render"]` を書く (C ABI・GDExtension に wgpu を入れないため。T0166)。
# no_std に対応したクレート (ugoe-core・ugoe-model・ugoe-format・ugoe-runtime・ugoe-physics・ugoe-motion) の既定の feature (std) も切ってある。使う側で `features = ["std"]` を書く (ADR 0031)。
ugoe = { path = "crates/ugoe", version = "0.0.0", default-features = false }
ugoe-ai = { path = "crates/ugoe-ai" }
ugoe-core = { path = "crates/ugoe-core", version = "0.0.0", default-features = false }
ugoe-editor-core = { path = "crates/ugoe-editor-core" }
ugoe-format = { path = "crates/ugoe-format", version = "0.0.0", default-features = false }
ugoe-fs = { path = "crates/ugoe-fs" }
ugoe-headless = { path = "crates/ugoe-headless" }
ugoe-mcp = { path = "crates/ugoe-mcp" }
ugoe-mesher = { path = "crates/ugoe-mesher" }
ugoe-model = { path = "crates/ugoe-model", version = "0.0.0", default-features = false }
ugoe-motion = { path = "crates/ugoe-motion", version = "0.0.0", default-features = false }
ugoe-physics = { path = "crates/ugoe-physics", version = "0.0.0", default-features = false }
ugoe-psd = { path = "crates/ugoe-psd" }
ugoe-render = { path = "crates/ugoe-render", version = "0.0.0" }
ugoe-rigging = { path = "crates/ugoe-rigging" }
ugoe-runtime = { path = "crates/ugoe-runtime", version = "0.0.0", default-features = false }
ugoe-studio-vcam = { path = "apps/studio/vcam" }
# --- external ---
# ランタイム層が使う依存 (glam・ruzstd・serde・serde_json・thiserror) は既定の feature を切ってある。メンバーの
# `default-features = false` はここで切らないと効かないため (docs/adr/0031-no-std-runtime-and-host-neutral-c-abi.md)。
# 使う側で `features = ["std"]` (ruzstd は `["hash", "std"]`) を書く。no_std に対応したランタイム層のクレートは、自分の feature `std` から有効にする。
anyhow = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
base64 = "0.22"
bcdec_rs = "0.2"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
dbus = "0.9"
dbus-secret-service = "4"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
encoding_rs = "0.8"
getrandom = "0.3"
glam = { version = "0.33", default-features = false, features = ["all-types", "bytemuck", "serde"] }
gtk = "0.18"
image-webp = "0.2"
insta = { version = "1", features = ["json"] }
js-sys = "0.3"
keyring-core = "1"
libc = "0.2"
# ランタイム層の数学関数 (ugoe_core::math)。std の有無と OS にかかわらず同じ結果にする (docs/adr/0031-no-std-runtime-and-host-neutral-c-abi.md)
libm = "0.2"
miniz_oxide = "0.9"
naga = { version = "30", features = ["wgsl-in"] }
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-media-io = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-system-extensions = { version = "0.3", default-features = false, features = ["std"] }
png = "0.18"
pollster = "1"
rmp-serde = "1"
ruzstd = { version = "0.9", default-features = false }
schemars = "1"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
spade = "2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
thiserror = { version = "2", default-features = false }
tracing = "0.1"
ts-rs = "12"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
wgpu = "30"
windows = "0.62"
windows-core = "0.62"
windows-native-keyring-store = { version = "1", default-features = false }
zune-jpeg = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
