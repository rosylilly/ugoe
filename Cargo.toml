[workspace]
resolver = "3"
members = ["crates/*", "apps/editor/src-tauri", "apps/viewer/src-tauri", "apps/studio/src-tauri", "apps/studio/vcam", "tests/conformance"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/rosylilly/ugoe"
# 既定では公開しない。crates.io に公開するクレートだけ `publish = true` にする (docs/adr/0027-crates-io-publishing.md)。
publish = false
license = "MIT"

# 依存は必ずここで宣言し、各クレートでは `foo.workspace = true` で参照する。
# マージ衝突を減らすため 1 行 1 依存・アルファベット順を守ること。
[workspace.dependencies]
# --- internal ---
# crates.io に公開するクレート (publish = true) は、path に加えて version を書く (公開したパッケージでは version だけが残る)。
# version は [workspace.package] の version と揃える (`node scripts/crates.mjs sync`。docs/release.md)。
ugoe = { path = "crates/ugoe", version = "0.0.0" }
ugoe-ai = { path = "crates/ugoe-ai" }
ugoe-core = { path = "crates/ugoe-core", version = "0.0.0" }
ugoe-editor-core = { path = "crates/ugoe-editor-core" }
ugoe-format = { path = "crates/ugoe-format", version = "0.0.0" }
ugoe-headless = { path = "crates/ugoe-headless" }
ugoe-mcp = { path = "crates/ugoe-mcp" }
ugoe-mesher = { path = "crates/ugoe-mesher" }
ugoe-model = { path = "crates/ugoe-model", version = "0.0.0" }
ugoe-motion = { path = "crates/ugoe-motion", version = "0.0.0" }
ugoe-physics = { path = "crates/ugoe-physics", version = "0.0.0" }
ugoe-psd = { path = "crates/ugoe-psd" }
ugoe-render = { path = "crates/ugoe-render", version = "0.0.0" }
ugoe-rigging = { path = "crates/ugoe-rigging" }
ugoe-runtime = { path = "crates/ugoe-runtime", version = "0.0.0" }
ugoe-studio-vcam = { path = "apps/studio/vcam" }
# --- external ---
anyhow = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
encoding_rs = "0.8"
getrandom = "0.3"
glam = { version = "0.33", features = ["serde", "bytemuck"] }
insta = { version = "1", features = ["json"] }
js-sys = "0.3"
keyring-core = "1"
libc = "0.2"
miniz_oxide = "0.9"
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18"
pollster = "1"
rmp-serde = "1"
ruzstd = "0.9"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spade = "2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
thiserror = "2"
tracing = "0.1"
ts-rs = "12"
ureq = { version = "3", default-features = false, features = ["rustls"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
wgpu = "30"
windows = "0.62"
windows-core = "0.62"
windows-native-keyring-store = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
